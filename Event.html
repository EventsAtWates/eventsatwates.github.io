<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Building in the age of AI – Events at Wates</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Lora:ital,wght@0,400;0,500;1,400;1,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF8F3;color:#2F2E3F;font-family:'Figtree',system-ui,sans-serif}
a{color:#004156}a:hover{color:#2F2E3F}
button:focus-visible,a:focus-visible{outline:3px solid #008FA8;outline-offset:2px}
</style>

<style>body{margin:0}
.preview-tag{position:fixed;left:12px;bottom:12px;z-index:50;padding:8px 14px;border-radius:999px;background:#F9E569;color:#2F2E3F;font:700 13px Figtree,system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.2);pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Lora:ital,wght@0,400;0,500;1,400;1,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF8F3;color:#2F2E3F;font-family:'Figtree',system-ui,sans-serif}
a{color:#004156}a:hover{color:#2F2E3F}
button:focus-visible,a:focus-visible{outline:3px solid #008FA8;outline-offset:2px}
</style>
</helmet>
<div style="font-family: 'Figtree', system-ui, sans-serif; color: #2F2E3F; background: #FAF8F3; min-height: 100vh">

  <header style="background: #FFFFFF; border-bottom: 1px solid #E6E1D6">
    <div style="max-width: 1280px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; gap: 28px; flex-wrap: wrap">
      <a href="index.html" style="display: flex; align-items: center; gap: 16px; text-decoration: none; color: #2F2E3F">
        <img src="assets/logo-midnight.png" alt="Wates Construction" style="height: 42px; width: auto">
        <span style="width: 1px; height: 32px; background: #D9D4C7" aria-hidden="true"></span>
        <span style="font-weight: 800; font-size: 18px">Events at Wates</span>
      </a>
      <nav aria-label="Main" style="display: flex; gap: 24px; flex-wrap: wrap; flex: 1 1 auto; font-size: 16px; font-weight: 600">
        <a href="Dashboard.html" style="color: #2F2E3F; text-decoration: none">My events</a>
        <a href="Tokens.html" style="color: #2F2E3F; text-decoration: none">My credits</a>
        <a href="Interest.html" style="color: #2F2E3F; text-decoration: none">Suggest an event</a>
        <a href="Feedback.html" style="color: #2F2E3F; text-decoration: none">Feedback</a>
      </nav>
      <a href="Tokens.html" style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; border-radius: 999px; background: #F9E569; color: #2F2E3F; font-weight: 800; font-size: 15px; text-decoration: none"><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; background: #2F2E3F; color: #F9E569; display: inline-flex; align-items: center; justify-content: center; font-size: 12px">W</span>{{ balance }} credits left</a>
      <a href="Tokens.html" aria-label="Your account: Rico Cacciatore" style="width: 44px; height: 44px; border-radius: 50%; background: #2F2E3F; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; text-decoration: none">RC</a>
    </div>
  </header>

  <!-- event hero -->
  <section style="background: #C1D1FF; position: relative; overflow: hidden">
    <svg aria-hidden="true" viewBox="0 0 1440 360" preserveAspectRatio="xMaxYMid slice" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none">
      <path d="M700 300 C 820 240, 900 340, 1010 280 C 1090 236, 1070 180, 1020 196 C 970 212, 1030 290, 1140 250 S 1180 190, 1268 128" fill="none" stroke="#004156" stroke-width="2.5" stroke-linecap="round"></path><g transform="translate(1262 112) rotate(-16) scale(.9)"><path d="M4 18 C40 4 100 0 146 6 C108 10 80 20 60 36 C52 28 42 24 30 28 C20 28 10 24 4 18Z" fill="#6BB8D0" opacity=".75"/><path d="M4 18 C10 24 20 28 30 28 C42 24 52 28 60 36 C70 22 90 12 118 7 C80 6 40 8 4 18Z" fill="#0092AE"/><path d="M4 18 C40 4 100 0 146 6 C110 5 70 6 36 16 C24 18 14 18 4 18Z" fill="#004156"/></g>
    </svg>
    <div style="position: relative; max-width: 1280px; margin: 0 auto; padding: 40px 32px 56px">
      <nav aria-label="Breadcrumb" style="font-size: 15px; font-weight: 600"><a href="Dashboard.html">My events</a>  /  <span>Thought leadership</span></nav>
      <p style="margin: 28px 0 0; display: inline-block; padding: 8px 14px; border-radius: 999px; background: #2F2E3F; color: #FFFFFF; font-size: 14px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase">Thought leadership</p>
      <h1 style="margin: 18px 0 0; font-size: clamp(40px, 5vw, 64px); line-height: 1.02; font-weight: 800; letter-spacing: -0.02em; max-width: 820px">Building in the age of AI: breakfast roundtable</h1>
      <p style="margin: 18px 0 0; font-family: 'Lora', Georgia, serif; font-size: 22px; line-height: 1.45; max-width: 760px">How artificial intelligence and digital tools will reshape the way we design, build and manage projects.</p>
      <div style="margin-top: 24px; display: flex; flex-wrap: wrap; gap: 24px; font-size: 17px; font-weight: 600">
        <span>Thursday 12 November 2026</span><span>08:00–10:00</span><span>The Foundry Rooms, Southwark, London</span>
      </div>
    </div>
  </section>

  <main style="max-width: 1280px; margin: 0 auto; padding: 48px 32px 80px; display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start">

    <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 48px">

      <section aria-labelledby="about">
        <h2 id="about" style="margin: 0 0 14px; font-size: 30px; font-weight: 800">About this event</h2>
        <p style="margin: 0 0 14px; font-size: 18px; line-height: 1.65">A small, informal breakfast for clients, consultants and Wates colleagues to talk about where AI is genuinely changing construction, and where it isn’t yet.</p>
        <p style="margin: 0; font-size: 18px; line-height: 1.65">A short panel opens the session, then tables of six discuss one question each. Expect real conversations, not a sales pitch.</p>
      </section>

      <section aria-labelledby="agenda">
        <h2 id="agenda" style="margin: 0 0 18px; font-size: 30px; font-weight: 800">Running order</h2>
        <ol style="list-style: none; margin: 0; padding: 0; border-left: 3px solid #008FA8; display: flex; flex-direction: column; gap: 22px">
          <li style="padding-left: 24px"><p style="margin: 0; font-size: 15px; font-weight: 800; color: #004156">08:00</p><p style="margin: 4px 0 0; font-size: 18px">Arrival, breakfast and check-in</p></li>
          <li style="padding-left: 24px"><p style="margin: 0; font-size: 15px; font-weight: 800; color: #004156">08:30</p><p style="margin: 4px 0 0; font-size: 18px">Panel: what AI is changing on our projects</p></li>
          <li style="padding-left: 24px"><p style="margin: 0; font-size: 15px; font-weight: 800; color: #004156">09:10</p><p style="margin: 4px 0 0; font-size: 18px">Roundtables: one question per table</p></li>
          <li style="padding-left: 24px"><p style="margin: 0; font-size: 15px; font-weight: 800; color: #004156">09:50</p><p style="margin: 4px 0 0; font-size: 18px">Wrap-up and time to talk</p></li>
        </ol>
      </section>

      <section aria-labelledby="who">
        <h2 id="who" style="margin: 0; font-size: 30px; font-weight: 800">Who’s expected</h2>
        <p style="margin: 10px 0 20px; font-size: 16px; line-height: 1.55; color: #4B4A5C">Key people the organisers expect to attend. Attendance isn’t guaranteed, and names are shared only with colleagues who have booked.</p>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px">
          <template data-sc="for" list="{{ people }}" as="p">
            <div style="background: #FFFFFF; border-radius: 20px; padding: 18px; display: flex; gap: 14px; align-items: center">
              <span aria-hidden="true" style="flex: 0 0 auto; width: 52px; height: 52px; border-radius: 50%; background: {{ p.colour }}; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px">{{ p.initials }}</span>
              <div style="min-width: 0">
                <p style="margin: 0; font-size: 17px; font-weight: 700">{{ p.name }}</p>
                <p style="margin: 2px 0 0; font-size: 15px; color: #4B4A5C">{{ p.role }}</p>
                <p style="margin: 6px 0 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #004156">{{ p.group }}</p>
              </div>
            </div>
          </template>
        </div>
      </section>

      <section aria-labelledby="brief" style="background: #FFFFFF; border-radius: 28px; padding: 32px">
        <h2 id="brief" style="margin: 0 0 6px; font-size: 26px; font-weight: 800">Before you go</h2>
        <p style="margin: 0 0 20px; font-family: 'Lora', Georgia, serif; font-size: 19px; color: #004156">A two-minute briefing from Wates Next Gen.</p>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px">
          <div><p style="margin: 0; font-size: 32px; font-weight: 800">01</p><p style="margin: 8px 0 4px; font-size: 17px; font-weight: 700">Who matters most</p><p style="margin: 0; font-size: 15px; line-height: 1.55">The relationships we’d most like to build at this event, and who at Wates already knows them.</p></div>
          <div><p style="margin: 0; font-size: 32px; font-weight: 800">02</p><p style="margin: 8px 0 4px; font-size: 17px; font-weight: 700">What Wates can offer</p><p style="margin: 0; font-size: 15px; line-height: 1.55">Two or three projects or capabilities worth mentioning, so everyone tells the same story.</p></div>
          <div><p style="margin: 0; font-size: 32px; font-weight: 800">03</p><p style="margin: 8px 0 4px; font-size: 17px; font-weight: 700">Good conversation starters</p><p style="margin: 0; font-size: 15px; line-height: 1.55">Questions to open with, especially if it’s your first event.</p></div>
        </div>
      </section>

      <p style="margin: 0; font-size: 15px; color: #4B4A5C">Co-hosted with [Supply chain partner]. Sponsorship is declared under the Wates hospitality policy and never influences procurement.</p>
    </div>

    <!-- booking panel -->
    <aside aria-labelledby="book" style="flex: 1 1 340px; min-width: 0; background: #FFFFFF; border-radius: 28px; padding: 30px; display: flex; flex-direction: column; gap: 18px; border: 2px solid #2F2E3F">
      <h2 id="book" style="margin: 0; font-size: 22px; font-weight: 800">Book your place</h2>
      <div style="display: flex; align-items: center; gap: 16px">
        <span style="background: #2F2E3F; color: #FFFFFF; border-radius: 18px; padding: 12px 16px; text-align: center"><span style="display: block; font-size: 36px; font-weight: 800; line-height: 1">2</span><span style="display: block; font-size: 13px; font-weight: 600">credits</span></span>
        <p style="margin: 0; font-size: 16px; line-height: 1.45">About 2 hours of your networking time. You have <strong>{{ balance }}</strong> credits left.</p>
      </div>
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; font-size: 16px">
        <li style="display: flex; justify-content: space-between; gap: 12px"><span>Places left</span><strong>6 of 20</strong></li>
        <li style="display: flex; justify-content: space-between; gap: 12px"><span>External guests confirmed</span><strong>11</strong></li>
        <li style="display: flex; justify-content: space-between; gap: 12px"><span>Wates colleagues booked</span><strong>8</strong></li>
      </ul>

      <template data-sc="if" value="{{ notBooked }}">
        <div style="display: flex; flex-direction: column; gap: 12px">
          <button type="button" onClick="{{ book }}" style="min-height: 54px; border-radius: 999px; border: 0; background: #2F2E3F; color: #FFFFFF; font-family: inherit; font-weight: 800; font-size: 17px; cursor: pointer">Book my place · 2 credits</button>
          <a href="Interest.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 999px; border: 2px solid #2F2E3F; color: #2F2E3F; font-weight: 700; font-size: 16px; text-decoration: none">Not sure yet? Register interest</a>
        </div>
      </template>
      <template data-sc="if" value="{{ booked }}">
        <div role="status" style="background: #CDE6A7; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 8px">
          <p style="margin: 0; font-size: 18px; font-weight: 800">Request sent</p>
          <p style="margin: 0; font-size: 15px; line-height: 1.5">2 credits are booked for you. Your line manager has been asked to approve, and we’ll email you when they do.</p>
          <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px">
            <a href="CheckIn.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; background: #2F2E3F; color: #FFFFFF; font-weight: 700; font-size: 15px; text-decoration: none">See my ticket</a>
            <button type="button" onClick="{{ cancel }}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid #2F2E3F; background: transparent; color: #2F2E3F; font-family: inherit; font-weight: 700; font-size: 15px; cursor: pointer">Cancel booking</button>
          </div>
        </div>
      </template>

      <div style="background: #FAF8F3; border-radius: 18px; padding: 16px; font-size: 14px; line-height: 1.55">
        <p style="margin: 0 0 6px; font-weight: 800">Your credits</p>
        <p style="margin: 0">Cancel by 10 November (48 hours before) and your credits go straight back. If you can’t make it and haven’t cancelled, the hours are released for someone on the waiting list.</p>
      </div>
      <a href="#" style="font-size: 15px; font-weight: 600">Add to Outlook calendar</a>
    </aside>
  </main>
</div>
</template>
<script type="text/plain" id="logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { booked: false };
  }
  renderVals() {
    var self = this;
    var booked = this.state.booked;
    return {
      booked: booked,
      notBooked: !booked,
      balance: booked ? 7 : 9,
      book: function () { self.setState({ booked: true }); },
      cancel: function () { self.setState({ booked: false }); },
      people: [
        { initials: 'CL', name: '[Name]', role: 'Head of Development, [Client organisation]', group: 'Client', colour: '#F9E569' },
        { initials: 'CC', name: '[Name]', role: 'Partner, [Cost consultancy]', group: 'Cost consultant', colour: '#F7C8B3' },
        { initials: 'DC', name: '[Name]', role: 'Associate Director, [Architecture practice]', group: 'Design consultant', colour: '#CDE6A7' },
        { initials: 'PM', name: '[Name]', role: 'Project Director, [Project management firm]', group: 'Project manager', colour: '#FFC66C' },
        { initials: 'WN', name: '[Name]', role: 'Event host, Wates Next Gen', group: 'Wates host', colour: '#C1D1FF' }
      ]
    };
  }
}
</script>
<div class="preview-tag" aria-hidden="true">Concept preview · sample content</div>
<script src="dc.js"></script>
</body>
</html>
