<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>My credits – Events at Wates</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Lora:ital,wght@0,400;0,500;1,400;1,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF8F3;color:#2F2E3F;font-family:'Figtree',system-ui,sans-serif}
a{color:#004156}a:hover{color:#2F2E3F}
a:focus-visible{outline:3px solid #008FA8;outline-offset:2px}
</style>

<style>body{margin:0}
.preview-tag{position:fixed;left:12px;bottom:12px;z-index:50;padding:8px 14px;border-radius:999px;background:#F9E569;color:#2F2E3F;font:700 13px Figtree,system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.2);pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Lora:ital,wght@0,400;0,500;1,400;1,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF8F3;color:#2F2E3F;font-family:'Figtree',system-ui,sans-serif}
a{color:#004156}a:hover{color:#2F2E3F}
a:focus-visible{outline:3px solid #008FA8;outline-offset:2px}
</style>
</helmet>
<div style="font-family: 'Figtree', system-ui, sans-serif; color: #2F2E3F; background: #FAF8F3; min-height: 100vh">

  <header style="background: #FFFFFF; border-bottom: 1px solid #E6E1D6">
    <div style="max-width: 1280px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; gap: 28px; flex-wrap: wrap">
      <a href="index.html" style="display: flex; align-items: center; gap: 16px; text-decoration: none; color: #2F2E3F">
        <img src="assets/logo-midnight.png" alt="Wates Construction" style="height: 42px; width: auto">
        <span style="width: 1px; height: 32px; background: #D9D4C7" aria-hidden="true"></span>
        <span style="font-weight: 800; font-size: 18px">Events at Wates</span>
      </a>
      <nav aria-label="Main" style="display: flex; gap: 24px; flex-wrap: wrap; flex: 1 1 auto; font-size: 16px; font-weight: 600">
        <a href="Dashboard.html" style="color: #2F2E3F; text-decoration: none">My events</a>
        <a href="Tokens.html" aria-current="page" style="color: #2F2E3F; text-decoration: none; border-bottom: 3px solid #008FA8; padding-bottom: 4px">My credits</a>
        <a href="Interest.html" style="color: #2F2E3F; text-decoration: none">Suggest an event</a>
        <a href="Feedback.html" style="color: #2F2E3F; text-decoration: none">Feedback</a>
      </nav>
      <a href="Tokens.html" style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; border-radius: 999px; background: #F9E569; color: #2F2E3F; font-weight: 800; font-size: 15px; text-decoration: none"><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; background: #2F2E3F; color: #F9E569; display: inline-flex; align-items: center; justify-content: center; font-size: 12px">W</span>9 credits left</a>
      <a href="Tokens.html" aria-label="Your account: Rico Cacciatore" style="width: 44px; height: 44px; border-radius: 50%; background: #2F2E3F; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; text-decoration: none">RC</a>
    </div>
  </header>

  <main style="max-width: 1280px; margin: 0 auto; padding: 48px 32px 80px">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap">
      <div>
        <p style="margin: 0 0 8px; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #004156">My credits</p>
        <h1 style="margin: 0; font-size: 52px; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em">9 credits left for 2026</h1>
        <p style="margin: 12px 0 0; font-family: 'Lora', Georgia, serif; font-size: 22px; line-height: 1.45; color: #004156">Credits simply help you keep track of your dedicated networking time: one credit for every hour.</p>
      </div>
      <a href="#" style="display: inline-flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 22px; border-radius: 999px; border: 2px solid #2F2E3F; color: #2F2E3F; font-weight: 800; font-size: 15px; text-decoration: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F2E3F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg>Download for my PDR</a>
    </div>

    <!-- credit chips -->
    <section aria-label="Credit balance" style="margin-top: 32px; background: #FFFFFF; border-radius: 28px; padding: 32px">
      <div role="img" aria-label="18 credits: 5 used, 4 booked, 9 left" style="display: flex; flex-wrap: wrap; gap: 10px">
        <template data-sc="for" list="{{ chips }}" as="c">
          <span aria-hidden="true" style="{{ c.style }}">W</span>
        </template>
      </div>
      <div style="margin-top: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px">
        <div><p style="margin: 0; font-size: 40px; font-weight: 800">18</p><p style="margin: 2px 0 0; font-size: 15px; color: #4B4A5C">Allowance for 2026</p></div>
        <div><p style="margin: 0; font-size: 40px; font-weight: 800">5</p><p style="margin: 2px 0 0; font-size: 15px; color: #4B4A5C"><span aria-hidden="true" style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #2F2E3F; margin-right: 6px"></span>Used: attended and checked in</p></div>
        <div><p style="margin: 0; font-size: 40px; font-weight: 800">4</p><p style="margin: 2px 0 0; font-size: 15px; color: #4B4A5C"><span aria-hidden="true" style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #008FA8; margin-right: 6px"></span>Booked for upcoming events</p></div>
        <div><p style="margin: 0; font-size: 40px; font-weight: 800">9</p><p style="margin: 2px 0 0; font-size: 15px; color: #4B4A5C"><span aria-hidden="true" style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 2px solid #2F2E3F; margin-right: 6px"></span>Left to spend</p></div>
      </div>
    </section>

    <!-- ledger -->
    <section aria-labelledby="led" style="margin-top: 40px">
      <h2 id="led" style="margin: 0 0 16px; font-size: 30px; font-weight: 800">Credit history</h2>
      <div style="overflow-x: auto; background: #FFFFFF; border-radius: 24px">
        <table style="width: 100%; min-width: 860px; border-collapse: collapse; font-size: 16px">
          <thead>
            <tr style="text-align: left; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #4B4A5C">
              <th scope="col" style="padding: 18px 22px; font-weight: 700">Date</th>
              <th scope="col" style="padding: 18px 12px; font-weight: 700">Event</th>
              <th scope="col" style="padding: 18px 12px; font-weight: 700">Credits</th>
              <th scope="col" style="padding: 18px 12px; font-weight: 700">Status</th>
              <th scope="col" style="padding: 18px 22px; font-weight: 700">Line manager approval</th>
            </tr>
          </thead>
          <tbody>
            <template data-sc="for" list="{{ rows }}" as="r">
              <tr style="border-top: 1px solid #E6E1D6">
                <td style="padding: 18px 22px; font-weight: 700; white-space: nowrap">{{ r.date }}</td>
                <td style="padding: 18px 12px"><span style="display: block; font-weight: 700">{{ r.title }}</span><span style="display: block; font-size: 14px; color: #4B4A5C">{{ r.type }}</span></td>
                <td style="padding: 18px 12px; font-weight: 800; white-space: nowrap">{{ r.credits }}</td>
                <td style="padding: 18px 12px"><span style="{{ r.pill }}">{{ r.status }}</span></td>
                <td style="padding: 18px 22px; color: #4B4A5C">{{ r.approval }}</td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </section>

    <div style="margin-top: 40px; display: flex; flex-wrap: wrap; gap: 24px; align-items: stretch">
      <!-- rules -->
      <section aria-labelledby="rules" style="flex: 1 1 520px; min-width: 0; background: #2F2E3F; color: #FFFFFF; border-radius: 28px; padding: 32px">
        <h2 id="rules" style="margin: 0 0 20px; font-size: 26px; font-weight: 800">How your credits work</h2>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px">
          <div><p style="margin: 0; display: inline-block; padding: 6px 12px; border-radius: 999px; background: #008FA8; font-size: 14px; font-weight: 800">Booked</p><p style="margin: 10px 0 0; font-size: 15px; line-height: 1.5; color: #E4E2EC">When you book, the hours are set aside for you until the event.</p></div>
          <div><p style="margin: 0; display: inline-block; padding: 6px 12px; border-radius: 999px; background: #CDE6A7; color: #2F2E3F; font-size: 14px; font-weight: 800">Used</p><p style="margin: 10px 0 0; font-size: 15px; line-height: 1.5; color: #E4E2EC">Checking in on the day logs your dedicated time.</p></div>
          <div><p style="margin: 0; display: inline-block; padding: 6px 12px; border-radius: 999px; background: #C1D1FF; color: #2F2E3F; font-size: 14px; font-weight: 800">Refunded</p><p style="margin: 10px 0 0; font-size: 15px; line-height: 1.5; color: #E4E2EC">Plans change. Cancel 48 hours or more before and they go straight back.</p></div>
          <div><p style="margin: 0; display: inline-block; padding: 6px 12px; border-radius: 999px; background: #F7C8B3; color: #2F2E3F; font-size: 14px; font-weight: 800">Released</p><p style="margin: 10px 0 0; font-size: 15px; line-height: 1.5; color: #E4E2EC">If you can’t make it and haven’t cancelled, the hours are released so someone on the waiting list can take the place.</p></div>
        </div>
      </section>

      <!-- allowances -->
      <section aria-labelledby="allow" style="flex: 1 1 340px; min-width: 0; background: #FFFFFF; border-radius: 28px; padding: 32px">
        <h2 id="allow" style="margin: 0 0 16px; font-size: 26px; font-weight: 800">Dedicated time each year</h2>
        <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; font-size: 17px">
          <li style="display: flex; justify-content: space-between; border-bottom: 1px solid #E6E1D6; padding-bottom: 12px"><span>Colleagues</span><strong>12 credits</strong></li>
          <li style="display: flex; justify-content: space-between; border-bottom: 1px solid #E6E1D6; padding-bottom: 12px"><span>Senior managers</span><strong>18 credits</strong></li>
          <li style="display: flex; justify-content: space-between"><span>Directors</span><strong>24 credits</strong></li>
        </ul>
        <p style="margin: 16px 0 0; font-size: 14px; line-height: 1.5; color: #4B4A5C">Pro rata for part-time colleagues. Unused credits don’t carry over. Allowances to be confirmed by the business.</p>
      </section>
    </div>

    <!-- request more credits -->
    <section aria-labelledby="more" style="margin-top: 24px; background: #C1D1FF; border-radius: 28px; padding: 32px; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">
      <div style="flex: 1 1 320px; min-width: 0">
        <p style="margin: 0 0 8px; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #004156">Running low?</p>
        <h2 id="more" style="margin: 0; font-size: 30px; line-height: 1.15; font-weight: 800">Ask Wates Next Gen for more credits</h2>
        <p style="margin: 12px 0 0; font-family: 'Lora', Georgia, serif; font-size: 19px; line-height: 1.45; color: #004156">Used all your dedicated time but there’s an event you really don’t want to miss? Tell us why and the group will take a look.</p>
        <p style="margin: 12px 0 0; font-size: 15px; line-height: 1.5">The Next Gen team reviews requests every week and replies by email. Your line manager is copied in.</p>
      </div>
      <div style="flex: 1 1 380px; min-width: 0; background: #FFFFFF; border-radius: 22px; padding: 24px">
        <template data-sc="if" value="{{ notSent }}">
          <form onSubmit="{{ send }}" style="display: flex; flex-direction: column; gap: 14px">
            <label style="font-size: 15px; font-weight: 700">How many extra credits?
              <select style="display: block; margin-top: 6px; width: 100%; min-height: 48px; border-radius: 14px; border: 2px solid #D9D4C7; background: #FAF8F3; font-family: inherit; font-size: 16px; padding: 0 12px">
                <option>2 credits (one more event)</option><option>3 credits</option><option>4 credits</option><option>6 credits (a conference)</option>
              </select>
            </label>
            <label style="font-size: 15px; font-weight: 700">Which event is it for? (optional)
              <input type="text" placeholder="e.g. London Construction Leaders Summit" style="display: block; margin-top: 6px; width: 100%; box-sizing: border-box; min-height: 48px; border-radius: 14px; border: 2px solid #D9D4C7; background: #FAF8F3; font-family: inherit; font-size: 16px; padding: 0 12px">
            </label>
            <label style="font-size: 15px; font-weight: 700">Why would more time help?
              <textarea rows="3" placeholder="A client I’ve been working with is attending…" style="display: block; margin-top: 6px; width: 100%; box-sizing: border-box; border-radius: 14px; border: 2px solid #D9D4C7; background: #FAF8F3; font-family: inherit; font-size: 16px; padding: 12px"></textarea>
            </label>
            <button type="submit" style="min-height: 52px; border-radius: 999px; border: 0; background: #2F2E3F; color: #FFFFFF; font-family: inherit; font-weight: 800; font-size: 16px; cursor: pointer">Send request to Wates Next Gen</button>
          </form>
        </template>
        <template data-sc="if" value="{{ sent }}">
          <div role="status" style="background: #CDE6A7; border-radius: 18px; padding: 20px">
            <p style="margin: 0; font-size: 20px; font-weight: 800">Request sent</p>
            <p style="margin: 8px 0 0; font-size: 15px; line-height: 1.5">Thanks, Rico. Wates Next Gen will reply by email within a week, and your line manager has been copied in. Any extra credits will appear in your balance.</p>
            <button type="button" onClick="{{ again }}" style="margin-top: 14px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 2px solid #2F2E3F; background: transparent; color: #2F2E3F; font-family: inherit; font-weight: 700; font-size: 15px; cursor: pointer">Make another request</button>
          </div>
        </template>
      </div>
    </section>
  </main>
</div>
</template>
<script type="text/plain" id="logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sent: false };
  }
  renderVals() {
    var self = this;
    var chips = [];
    var base = 'width: 46px; height: 46px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; box-sizing: border-box; ';
    for (var i = 0; i < 18; i++) {
      var s;
      if (i < 5) s = base + 'background: #2F2E3F; color: #F9E569;';
      else if (i < 9) s = base + 'background: #008FA8; color: #FFFFFF;';
      else s = base + 'background: #FFFFFF; color: #2F2E3F; border: 2px dashed #2F2E3F;';
      chips.push({ style: s });
    }
    var pill = function (bg, fg) { return 'display: inline-block; padding: 6px 12px; border-radius: 999px; font-size: 14px; font-weight: 800; background: ' + bg + '; color: ' + fg + ';'; };
    var rows = [
      { date: 'Wed 18 Nov', title: 'Site tour of 56 Bishops Avenue and talks from selected product manufacturers such as IGMS', type: 'Site visit', credits: '−2', status: 'Booked', pill: pill('#008FA8', '#FFFFFF'), approval: 'Waiting for approval' },
      { date: 'Thu 12 Nov', title: 'Building in the age of AI: breakfast roundtable', type: 'Thought leadership', credits: '−2', status: 'Booked', pill: pill('#008FA8', '#FFFFFF'), approval: 'Approved 21 Oct' },
      { date: 'Thu 15 Oct', title: 'Charity quiz night with consultants', type: 'Sports and social', credits: '−3', status: 'Used', pill: pill('#CDE6A7', '#2F2E3F'), approval: 'Approved 2 Oct' },
      { date: 'Thu 8 Oct', title: 'Autumn drinks with client teams', type: 'Drinks and dinner', credits: '0', status: 'Refunded', pill: pill('#C1D1FF', '#2F2E3F'), approval: 'Cancelled 5 days before' },
      { date: 'Thu 24 Sep', title: 'Net zero in practice: breakfast briefing', type: 'Thought leadership', credits: '−2', status: 'Used', pill: pill('#CDE6A7', '#2F2E3F'), approval: 'Approved 10 Sep' }
    ];
    return {
      chips: chips, rows: rows,
      sent: this.state.sent, notSent: !this.state.sent,
      send: function (e) { if (e && e.preventDefault) e.preventDefault(); self.setState({ sent: true }); },
      again: function () { self.setState({ sent: false }); }
    };
  }
}
</script>
<div class="preview-tag" aria-hidden="true">Concept preview · sample content</div>
<script src="dc.js"></script>
</body>
</html>
