<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>My bookings – Events at Wates</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Lora:ital,wght@0,400;0,500;1,400;1,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF8F3;color:#2F2E3F;font-family:'Figtree',system-ui,sans-serif}
a{color:#004156}a:hover{color:#2F2E3F}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #008FA8;outline-offset:2px}
</style>

<style>body{margin:0}
.preview-tag{position:fixed;left:12px;bottom:12px;z-index:50;display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;background:#F9E569;color:#2F2E3F;font:700 13px Figtree,system-ui,sans-serif;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.preview-tag:hover{color:#2F2E3F;text-decoration:underline}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="font-family: 'Figtree', system-ui, sans-serif; color: #2F2E3F; background: #FAF8F3; min-height: 100vh">

  <header style="background: #FFFFFF; border-bottom: 1px solid #E6E1D6">
    <div style="max-width: 1280px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; gap: 28px; flex-wrap: wrap">
      <a href="index.html" style="display: flex; align-items: center; gap: 16px; text-decoration: none; color: #2F2E3F">
        <img src="assets/logo-midnight.png" alt="Wates Construction" style="height: 42px; width: auto">
        <span style="width: 1px; height: 32px; background: #D9D4C7" aria-hidden="true"></span>
        <span style="font-weight: 800; font-size: 18px">Events at Wates</span>
      </a>
      <nav aria-label="Main" style="display: flex; gap: 24px; flex-wrap: wrap; flex: 1 1 auto; font-size: 16px; font-weight: 600">
        <a href="Dashboard.html" style="color: #2F2E3F; text-decoration: none">My events</a>
        <a href="Tokens.html" aria-current="page" style="color: #2F2E3F; text-decoration: none; border-bottom: 3px solid #008FA8; padding-bottom: 4px">My bookings</a>
        <a href="Interest.html" style="color: #2F2E3F; text-decoration: none">Suggest an event</a>
        <a href="Feedback.html" style="color: #2F2E3F; text-decoration: none">Feedback</a>
        <a href="Ambassadors.html" style="color: #2F2E3F; text-decoration: none">Ambassadors</a>
      </nav>
      <a href="Tokens.html" aria-label="Your account: Antony Wadey" style="width: 44px; height: 44px; border-radius: 50%; background: #2F2E3F; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; text-decoration: none">AW</a>
    </div>
  </header>

  <main style="max-width: 1280px; margin: 0 auto; padding: 48px 32px 80px; display: flex; flex-direction: column; gap: 44px">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap">
      <div>
        <p style="margin: 0 0 8px; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #004156">My bookings</p>
        <h1 style="margin: 0; font-size: 52px; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em">Your events this year</h1>
        <p style="margin: 12px 0 0; font-family: 'Lora', Georgia, serif; font-size: 22px; line-height: 1.45; color: #004156">Everything you’ve booked and attended, ready for your PDR conversations.</p>
      </div>
      <a href="#" style="display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 22px; border-radius: 999px; border: 2px solid #2F2E3F; background: transparent; color: #2F2E3F; font-family: inherit; font-weight: 700; font-size: 15px; cursor: pointer; text-decoration: none; gap: 10px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F2E3F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg>Download for my PDR</a>
    </div>

    <section aria-labelledby="up">
      <h2 id="up" style="margin: 0 0 16px; font-size: 28px; font-weight: 800">Coming up</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 16px">
        <article style="background: #FFFFFF; border-radius: 24px; padding: 24px; display: flex; gap: 18px; align-items: flex-start">
          <div style="background: #C1D1FF; border-radius: 16px; width: 76px; min-height: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 0 0 auto"><span style="font-size: 30px; font-weight: 800; line-height: 1">12</span><span style="font-size: 14px; font-weight: 700">Nov</span></div>
          <div style="min-width: 0; display: flex; flex-direction: column; gap: 6px">
            <p style="margin: 0; font-size: 19px; font-weight: 700">Building in the age of AI: breakfast roundtable</p>
            <p style="margin: 0; font-size: 15px; color: #4B4A5C">08:00–10:00  ·  The Foundry Rooms, Southwark</p>
            <p style="margin: 4px 0 0"><span style="display: inline-block; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 800; letter-spacing: 0.04em; background: #CDE6A7">Approved</span></p>
            <a href="Event.html" style="margin-top: 6px; font-size: 15px; font-weight: 700">View event and ticket</a>
          </div>
        </article>
        <article style="background: #FFFFFF; border-radius: 24px; padding: 24px; display: flex; gap: 18px; align-items: flex-start">
          <div style="background: #F9E569; border-radius: 16px; width: 76px; min-height: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 0 0 auto"><span style="font-size: 30px; font-weight: 800; line-height: 1">18</span><span style="font-size: 14px; font-weight: 700">Nov</span></div>
          <div style="min-width: 0; display: flex; flex-direction: column; gap: 6px">
            <p style="margin: 0; font-size: 19px; font-weight: 700">Site tour of 56 Bishops Avenue and talks from selected product manufacturers such as IGMS</p>
            <p style="margin: 0; font-size: 15px; color: #4B4A5C">14:00–16:00  ·  56 Bishops Avenue, London N2</p>
            <p style="margin: 4px 0 0"><span style="display: inline-block; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 800; letter-spacing: 0.04em; background: #F9E569">Awaiting line manager approval</span></p>
            <a href="Event.html" style="margin-top: 6px; font-size: 15px; font-weight: 700">View event</a>
          </div>
        </article>
      </div>
    </section>

    <section aria-labelledby="hist">
      <h2 id="hist" style="margin: 0 0 16px; font-size: 28px; font-weight: 800">History</h2>
      <div style="overflow-x: auto; background: #FFFFFF; border-radius: 24px">
        <table style="width: 100%; min-width: 860px; border-collapse: collapse; font-size: 16px">
          <thead>
            <tr style="text-align: left; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #4B4A5C">
              <th scope="col" style="padding: 18px 22px; font-weight: 700">Date</th>
              <th scope="col" style="padding: 18px 12px; font-weight: 700">Event</th>
              <th scope="col" style="padding: 18px 12px; font-weight: 700">Status</th>
              <th scope="col" style="padding: 18px 12px; font-weight: 700">People met</th>
              <th scope="col" style="padding: 18px 22px; font-weight: 700">Feedback</th>
            </tr>
          </thead>
          <tbody>
            <template data-sc="for" list="{{ rows }}" as="r">
              <tr style="border-top: 1px solid #E6E1D6">
                <td style="padding: 18px 22px; font-weight: 700; white-space: nowrap">{{ r.date }}</td>
                <td style="padding: 18px 12px"><span style="display: block; font-weight: 700">{{ r.title }}</span><span style="display: block; font-size: 14px; color: #4B4A5C">{{ r.type }}</span></td>
                <td style="padding: 18px 12px"><span style="{{ r.pill }}">{{ r.status }}</span></td>
                <td style="padding: 18px 12px">{{ r.met }}</td>
                <td style="padding: 18px 22px"><a href="Feedback.html" style="font-weight: 700">{{ r.feedback }}</a></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </section>

    <section style="background: #2F2E3F; color: #FFFFFF; border-radius: 28px; padding: 32px; display: flex; flex-wrap: wrap; gap: 24px; align-items: center; justify-content: space-between">
      <div style="flex: 1 1 520px; min-width: 0">
        <h2 style="margin: 0; font-size: 26px; font-weight: 800">Want to represent Wates at key client events?</h2>
        <p style="margin: 10px 0 0; font-size: 16px; line-height: 1.55; color: #E4E2EC">Wates Ambassadors get specific networking training and special access to events with pipeline stakeholders.</p>
      </div>
      <a href="Ambassadors.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 26px; border-radius: 999px; border: 0; background: #F9E569; color: #2F2E3F; font-family: inherit; font-weight: 800; font-size: 16px; cursor: pointer; text-decoration: none">Find out about becoming an ambassador</a>
    </section>
  </main>
</div>
</template>
<script type="text/plain" id="logic">
class Component extends DCLogic {
  renderVals() {
    var pill = function (bg) { return 'display: inline-block; padding: 6px 12px; border-radius: 999px; font-size: 14px; font-weight: 800; color: #2F2E3F; background: ' + bg + ';'; };
    return {
      rows: [
        { date: 'Thu 15 Oct', title: 'Charity quiz night with consultants', type: 'Sports and social', status: 'Attended', pill: pill('#CDE6A7'), met: '4 people', feedback: 'Give feedback' },
        { date: 'Thu 8 Oct', title: 'Autumn drinks with client teams', type: 'Drinks and dinner', status: 'Cancelled in time', pill: pill('#C1D1FF'), met: '—', feedback: '—' },
        { date: 'Thu 24 Sep', title: 'Net zero in practice: breakfast briefing', type: 'Thought leadership', status: 'Attended', pill: pill('#CDE6A7'), met: '3 people', feedback: 'Given' },
        { date: 'Wed 9 Sep', title: 'Site visit: [Project name]', type: 'Site visit', status: 'Attended', pill: pill('#CDE6A7'), met: '4 people', feedback: 'Given' }
      ]
    };
  }
}
</script>
<a class="preview-tag" href="screens.html">Concept preview · sample content · all screens</a>
<script src="dc.js"></script>
</body>
</html>
