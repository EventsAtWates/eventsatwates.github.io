<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>My events – Events at Wates</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Lora:ital,wght@0,400;0,500;1,400;1,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF8F3;color:#2F2E3F;font-family:'Figtree',system-ui,sans-serif}
a{color:#004156}a:hover{color:#2F2E3F}
button:focus-visible,a:focus-visible{outline:3px solid #008FA8;outline-offset:2px}
</style>

<style>body{margin:0}
.preview-tag{position:fixed;left:12px;bottom:12px;z-index:50;padding:8px 14px;border-radius:999px;background:#F9E569;color:#2F2E3F;font:700 13px Figtree,system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.2);pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Lora:ital,wght@0,400;0,500;1,400;1,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF8F3;color:#2F2E3F;font-family:'Figtree',system-ui,sans-serif}
a{color:#004156}a:hover{color:#2F2E3F}
button:focus-visible,a:focus-visible{outline:3px solid #008FA8;outline-offset:2px}
</style>
</helmet>
<div style="font-family: 'Figtree', system-ui, sans-serif; color: #2F2E3F; background: #FAF8F3; min-height: 100vh">

  <!-- signed-in header -->
  <header style="background: #FFFFFF; border-bottom: 1px solid #E6E1D6">
    <div style="max-width: 1280px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; gap: 28px; flex-wrap: wrap">
      <a href="index.html" style="display: flex; align-items: center; gap: 16px; text-decoration: none; color: #2F2E3F">
        <img src="assets/logo-midnight.png" alt="Wates Construction" style="height: 42px; width: auto">
        <span style="width: 1px; height: 32px; background: #D9D4C7" aria-hidden="true"></span>
        <span style="font-weight: 800; font-size: 18px">Events at Wates</span>
      </a>
      <nav aria-label="Main" style="display: flex; gap: 24px; flex-wrap: wrap; flex: 1 1 auto; font-size: 16px; font-weight: 600">
        <a href="Dashboard.html" aria-current="page" style="color: #2F2E3F; text-decoration: none; border-bottom: 3px solid #008FA8; padding-bottom: 4px">My events</a>
        <a href="Tokens.html" style="color: #2F2E3F; text-decoration: none">My credits</a>
        <a href="Interest.html" style="color: #2F2E3F; text-decoration: none">Suggest an event</a>
        <a href="Feedback.html" style="color: #2F2E3F; text-decoration: none">Feedback</a>
      </nav>
      <a href="Tokens.html" style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; border-radius: 999px; background: #F9E569; color: #2F2E3F; font-weight: 800; font-size: 15px; text-decoration: none"><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; background: #2F2E3F; color: #F9E569; display: inline-flex; align-items: center; justify-content: center; font-size: 12px">W</span>9 credits left</a>
      <a href="Tokens.html" aria-label="Your account: Rico Cacciatore" style="width: 44px; height: 44px; border-radius: 50%; background: #2F2E3F; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; text-decoration: none">RC</a>
    </div>
  </header>

  <main style="max-width: 1280px; margin: 0 auto; padding: 48px 32px 80px">
    <p style="margin: 0 0 8px; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #004156">My events</p>
    <h1 style="margin: 0; font-size: 52px; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em">Welcome back, Rico</h1>
    <p style="margin: 12px 0 0; font-family: 'Lora', Georgia, serif; font-size: 22px; line-height: 1.45; color: #004156">You have 9 hours of networking time left this year. Your next event is on Thursday 12 November.</p>

    <!-- summary cards -->
    <div style="margin-top: 36px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px">

      <!-- credit balance -->
      <section aria-labelledby="bal" style="background: #FFFFFF; border-radius: 28px; padding: 30px; display: flex; flex-direction: column; gap: 14px">
        <h2 id="bal" style="margin: 0; font-size: 18px; font-weight: 700">Credits available</h2>
        <p style="margin: 0; display: flex; align-items: baseline; gap: 10px"><span style="font-size: 88px; line-height: 0.9; font-weight: 800">9</span><span style="font-size: 20px; font-weight: 600; color: #4B4A5C">of 18</span></p>
        <div aria-hidden="true" style="display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: #E6E1D6">
          <span style="width: 27.8%; background: #2F2E3F"></span>
          <span style="width: 22.2%; background: #008FA8"></span>
        </div>
        <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 15px">
          <li style="display: flex; justify-content: space-between"><span><span aria-hidden="true" style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #2F2E3F; margin-right: 8px"></span>Used at events</span><strong>5</strong></li>
          <li style="display: flex; justify-content: space-between"><span><span aria-hidden="true" style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #008FA8; margin-right: 8px"></span>Booked for events</span><strong>4</strong></li>
          <li style="display: flex; justify-content: space-between"><span><span aria-hidden="true" style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #E6E1D6; border: 1px solid #B9B3A4; margin-right: 8px"></span>Left to spend</span><strong>9</strong></li>
        </ul>
        <p style="margin: 4px 0 0; font-size: 14px; color: #4B4A5C">Your dedicated time: 18 hours a year, reset on 1 January.</p>
      </section>

      <!-- hours pie chart -->
      <section aria-labelledby="pie" style="background: #FFFFFF; border-radius: 28px; padding: 30px">
        <h2 id="pie" style="margin: 0; font-size: 18px; font-weight: 700">My networking hours</h2>
        <div style="margin-top: 16px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center">
          <svg viewBox="0 0 180 180" width="170" height="170" role="img" aria-label="Pie chart of 18 networking hours: 4 thought leadership, 3 sports and social, 2 site visit, 9 left">
            <g transform="rotate(-90 90 90)">
              <circle cx="90" cy="90" r="70" fill="none" stroke="#E6E1D6" stroke-width="30"></circle>
              <circle cx="90" cy="90" r="70" fill="none" stroke="#C1D1FF" stroke-width="30" stroke-dasharray="97.74 439.82" stroke-dashoffset="0"></circle>
              <circle cx="90" cy="90" r="70" fill="none" stroke="#CDE6A7" stroke-width="30" stroke-dasharray="73.30 439.82" stroke-dashoffset="-97.74"></circle>
              <circle cx="90" cy="90" r="70" fill="none" stroke="#F9E569" stroke-width="30" stroke-dasharray="48.87 439.82" stroke-dashoffset="-171.04"></circle>
            </g>
            <text x="90" y="88" text-anchor="middle" font-family="Figtree, sans-serif" font-size="34" font-weight="800" fill="#2F2E3F">9 hrs</text>
            <text x="90" y="110" text-anchor="middle" font-family="Figtree, sans-serif" font-size="14" font-weight="600" fill="#4B4A5C">left of 18</text>
          </svg>
          <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 15px; flex: 1 1 150px">
            <li style="display: flex; justify-content: space-between; gap: 10px"><span><span aria-hidden="true" style="display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: #C1D1FF; margin-right: 8px"></span>Thought leadership</span><strong>4 h</strong></li>
            <li style="display: flex; justify-content: space-between; gap: 10px"><span><span aria-hidden="true" style="display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: #CDE6A7; margin-right: 8px"></span>Sports and social</span><strong>3 h</strong></li>
            <li style="display: flex; justify-content: space-between; gap: 10px"><span><span aria-hidden="true" style="display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: #F9E569; margin-right: 8px"></span>Site visits</span><strong>2 h</strong></li>
            <li style="display: flex; justify-content: space-between; gap: 10px"><span><span aria-hidden="true" style="display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: #E6E1D6; border: 1px solid #B9B3A4; margin-right: 8px"></span>Left to spend</span><strong>9 h</strong></li>
          </ul>
        </div>
        <p style="margin: 14px 0 0; font-size: 14px; color: #4B4A5C">Includes hours booked for upcoming events.</p>
      </section>

      <!-- next up -->
      <section aria-labelledby="next" style="background: #2F2E3F; color: #FFFFFF; border-radius: 28px; padding: 30px; display: flex; flex-direction: column; gap: 12px">
        <h2 id="next" style="margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #C1D1FF">Next up</h2>
        <p style="margin: 0; font-size: 40px; line-height: 1; font-weight: 800; color: #F9E569">Thu 12 Nov</p>
        <p style="margin: 0; font-size: 22px; line-height: 1.25; font-weight: 700">Building in the age of AI: breakfast roundtable</p>
        <p style="margin: 0; font-size: 15px; color: #E4E2EC">08:00–10:00  ·  The Foundry Rooms, Southwark, London  ·  2 credits booked</p>
        <div style="margin-top: auto; display: flex; gap: 10px; flex-wrap: wrap; padding-top: 8px">
          <a href="Event.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; background: #F9E569; color: #2F2E3F; font-weight: 800; font-size: 15px; text-decoration: none">View event</a>
          <a href="#" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 2px solid #FFFFFF; color: #FFFFFF; font-weight: 700; font-size: 15px; text-decoration: none">Add to Outlook</a>
        </div>
      </section>
    </div>

    <!-- feedback nudge -->
    <a href="Feedback.html" style="margin-top: 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; background: #CDE6A7; border-radius: 20px; padding: 18px 24px; color: #2F2E3F; text-decoration: none">
      <span style="font-size: 17px"><strong style="font-weight: 800">How was the October social?</strong> Tell us who you met and what came of it. It takes two minutes.</span>
      <span style="font-weight: 800; font-size: 15px">Give feedback →</span>
    </a>

    <!-- calendar -->
    <section aria-labelledby="cal" style="margin-top: 56px">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap">
        <div>
          <p style="margin: 0 0 8px; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #004156">Calendar</p>
          <h2 id="cal" style="margin: 0; font-size: 40px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em">Upcoming events</h2>
        </div>
        <div style="display: flex; align-items: center; gap: 12px">
          <button type="button" aria-label="Previous month" style="width: 44px; height: 44px; border-radius: 50%; border: 2px solid #D9D4C7; background: #FFFFFF; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F2E3F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></button>
          <p style="margin: 0; font-size: 20px; font-weight: 800; min-width: 160px; text-align: center">November 2026</p>
          <button type="button" aria-label="Next month" style="width: 44px; height: 44px; border-radius: 50%; border: 2px solid #D9D4C7; background: #FFFFFF; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F2E3F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg></button>
        </div>
      </div>

      <div role="group" aria-label="Filter by event type" style="margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap">
        <template data-sc="for" list="{{ types }}" as="t">
          <button type="button" onClick="{{ t.pick }}" aria-pressed="{{ t.pressed }}" style="{{ t.chipStyle }}"><span aria-hidden="true" style="{{ t.dotStyle }}"></span>{{ t.label }}</button>
        </template>
      </div>

      <div style="margin-top: 20px; overflow-x: auto; border-radius: 24px; background: #FFFFFF">
        <div style="min-width: 840px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr))">
          <template data-sc="for" list="{{ weekdays }}" as="w">
            <div style="padding: 14px 12px; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #4B4A5C; border-bottom: 1px solid #E6E1D6">{{ w }}</div>
          </template>
          <template data-sc="for" list="{{ cells }}" as="c">
            <div style="{{ c.cellStyle }}">
              <p style="{{ c.numStyle }}">{{ c.n }}</p>
              <template data-sc="for" list="{{ c.events }}" as="e">
                <a href="Event.html" style="{{ e.pillStyle }}"><span style="display: block; font-weight: 700">{{ e.short }}</span><span style="display: block; font-size: 12px; font-weight: 600">{{ e.credits }} credits{{ e.bookedMark }}</span></a>
              </template>
            </div>
          </template>
        </div>
      </div>
    </section>

    <!-- list -->
    <section aria-labelledby="list" style="margin-top: 48px">
      <h2 id="list" style="margin: 0 0 16px; font-size: 28px; font-weight: 800">Next working events</h2>
      <div style="display: flex; flex-direction: column; gap: 12px">
        <template data-sc="for" list="{{ listEvents }}" as="ev">
          <div style="background: #FFFFFF; border-radius: 20px; padding: 18px 22px; display: flex; flex-wrap: wrap; align-items: center; gap: 20px">
            <div style="background: {{ ev.colour }}; border-radius: 16px; width: 76px; min-height: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center">
              <span style="font-size: 30px; font-weight: 800; line-height: 1">{{ ev.day }}</span>
              <span style="font-size: 14px; font-weight: 700">{{ ev.mon }}</span>
            </div>
            <div style="flex: 1 1 320px; min-width: 0">
              <p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #004156">{{ ev.typeLabel }}</p>
              <p style="margin: 4px 0 0; font-size: 19px; font-weight: 700">{{ ev.title }}</p>
              <p style="margin: 4px 0 0; font-size: 15px; color: #4B4A5C">{{ ev.weekday }}  ·  {{ ev.time }}  ·  {{ ev.place }}</p>
            </div>
            <p style="margin: 0; font-size: 15px; font-weight: 700; min-width: 120px">{{ ev.credits }} credits<br><span style="font-weight: 500; color: #4B4A5C">{{ ev.spaces }}</span></p>
            <a href="{{ ev.href }}" style="{{ ev.btnStyle }}">{{ ev.cta }}</a>
          </div>
        </template>
      </div>
    </section>
  </main>
</div>
</template>
<script type="text/plain" id="logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all' };
  }
  renderVals() {
    var self = this;
    var TYPES = {
      tl: { label: 'Thought leadership', colour: '#C1D1FF' },
      site: { label: 'Site visit', colour: '#F9E569' },
      social: { label: 'Sports and social', colour: '#CDE6A7' },
      drinks: { label: 'Drinks and dinner', colour: '#F7C8B3' },
      conf: { label: 'Conference', colour: '#FFC66C' }
    };
    var EVENTS = [
      { key: 'n12', m: 11, d: 12, day: '12', mon: 'Nov', weekday: 'Thursday', type: 'tl', short: 'AI breakfast', title: 'Building in the age of AI: breakfast roundtable', time: '08:00–10:00', place: 'The Foundry Rooms, Southwark, London', credits: 2, spaces: '6 places left', status: 'booked' },
      { key: 'n18', m: 11, d: 18, day: '18', mon: 'Nov', weekday: 'Wednesday', type: 'site', short: 'Site tour', title: 'Site tour of 56 Bishops Avenue and talks from selected product manufacturers such as IGMS', time: '14:00–16:00', place: '56 Bishops Avenue, London N2', credits: 2, spaces: '9 places left', status: 'booked' },
      { key: 'n20', m: 11, d: 20, day: '20', mon: 'Nov', weekday: 'Friday', type: 'conf', short: 'Conference', title: 'London Construction Leaders Summit', time: '09:00–15:00', place: 'The Brewery, Chiswell Street, London', credits: 6, spaces: '4 places left', status: 'open' },
      { key: 'n26', m: 11, d: 26, day: '26', mon: 'Nov', weekday: 'Thursday', type: 'social', short: 'Five-a-side', title: 'Five-a-side with clients and consultants', time: '18:00–21:00', place: 'Canal Street Sports Club, King’s Cross, London', credits: 3, spaces: '12 places left', status: 'open' },
      { key: 'd01', m: 12, d: 1, day: '1', mon: 'Dec', weekday: 'Tuesday', type: 'drinks', short: 'Winter drinks', title: 'Winter drinks with our consultant partners', time: '18:00–21:00', place: 'The Albion Rooftop, Shoreditch, London', credits: 3, spaces: '20 places left', status: 'open' },
      { key: 'j20', m: 1, d: 20, day: '20', mon: 'Jan', weekday: 'Wednesday', type: 'tl', short: 'Market panel', title: 'London’s next chapter: market panel', time: '17:30–19:30', place: 'The Pearson Hall, Holborn, London', credits: 2, spaces: 'Booking opens 1 Dec', status: 'interest' }
    ];
    var f = this.state.filter;
    var shown = EVENTS.filter(function (e) { return f === 'all' || e.type === f; });

    // calendar: Monday 26 October to Sunday 6 December 2026
    var cells = [];
    var seq = [];
    var i;
    for (i = 26; i <= 31; i++) seq.push({ m: 10, d: i });
    for (i = 1; i <= 30; i++) seq.push({ m: 11, d: i });
    for (i = 1; i <= 6; i++) seq.push({ m: 12, d: i });
    seq.forEach(function (s, idx) {
      var inMonth = s.m === 11;
      var evs = shown.filter(function (e) { return e.m === s.m && e.d === s.d; }).map(function (e) {
        var col = TYPES[e.type].colour;
        return {
          short: e.short, credits: e.credits,
          bookedMark: e.status === 'booked' ? '  ·  Booked' : '',
          pillStyle: 'display: block; margin-top: 6px; padding: 6px 8px; border-radius: 10px; font-size: 13px; line-height: 1.25; text-decoration: none; color: #2F2E3F; background: ' + col + ';' + (e.status === 'booked' ? ' box-shadow: inset 0 0 0 2px #2F2E3F;' : '')
        };
      });
      var col = idx % 7;
      cells.push({
        n: String(s.d),
        events: evs,
        cellStyle: 'min-height: 112px; padding: 10px; box-sizing: border-box; border-bottom: 1px solid #E6E1D6;' + (col < 6 ? ' border-right: 1px solid #E6E1D6;' : '') + (inMonth ? '' : ' background: #FAF8F3;') + (col >= 5 ? ' background: #F6F3EC;' : ''),
        numStyle: 'margin: 0; font-size: 15px; font-weight: 700; color: ' + (inMonth ? '#2F2E3F' : '#77768A') + ';'
      });
    });

    var listEvents = shown.map(function (e) {
      var cta = e.status === 'booked' ? 'Booked · view' : e.status === 'interest' ? 'Register interest' : 'Book · ' + e.credits + ' credits';
      var dark = e.status === 'open';
      return Object.assign({}, e, {
        typeLabel: TYPES[e.type].label,
        colour: TYPES[e.type].colour,
        cta: cta,
        href: e.status === 'interest' ? 'Interest.html' : 'Event.html',
        btnStyle: 'display: inline-flex; align-items: center; min-height: 46px; padding: 0 20px; border-radius: 999px; font-weight: 800; font-size: 15px; text-decoration: none; ' + (dark ? 'background: #2F2E3F; color: #FFFFFF;' : 'background: #FFFFFF; color: #2F2E3F; border: 2px solid #2F2E3F;')
      });
    });

    var chipBase = 'display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; ';
    var keys = ['all', 'tl', 'site', 'social', 'drinks', 'conf'];
    var types = keys.map(function (k) {
      var on = f === k;
      return {
        label: k === 'all' ? 'All events' : TYPES[k].label,
        pressed: on ? 'true' : 'false',
        chipStyle: chipBase + (on ? 'background: #2F2E3F; color: #FFFFFF; border: 2px solid #2F2E3F' : 'background: #FFFFFF; color: #2F2E3F; border: 2px solid #D9D4C7'),
        dotStyle: k === 'all' ? 'display: none' : 'width: 12px; height: 12px; border-radius: 50%; border: 1px solid #2F2E3F; background: ' + TYPES[k].colour,
        pick: function () { self.setState({ filter: k }); }
      };
    });

    return {
      types: types,
      weekdays: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
      cells: cells,
      listEvents: listEvents
    };
  }
}
</script>
<div class="preview-tag" aria-hidden="true">Concept preview · sample content</div>
<script src="dc.js"></script>
</body>
</html>
