<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Register interest – Events at Wates</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Lora:ital,wght@0,400;0,500;1,400;1,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF8F3;color:#2F2E3F;font-family:'Figtree',system-ui,sans-serif}
a{color:#004156}a:hover{color:#2F2E3F}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #008FA8;outline-offset:2px}
</style>

<style>body{margin:0}
.preview-tag{position:fixed;left:12px;bottom:12px;z-index:50;padding:8px 14px;border-radius:999px;background:#F9E569;color:#2F2E3F;font:700 13px Figtree,system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.2);pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Lora:ital,wght@0,400;0,500;1,400;1,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF8F3;color:#2F2E3F;font-family:'Figtree',system-ui,sans-serif}
a{color:#004156}a:hover{color:#2F2E3F}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #008FA8;outline-offset:2px}
</style>
</helmet>
<div style="font-family: 'Figtree', system-ui, sans-serif; color: #2F2E3F; background: #FAF8F3; min-height: 100vh">

  <header style="background: #FFFFFF; border-bottom: 1px solid #E6E1D6">
    <div style="max-width: 1280px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; gap: 28px; flex-wrap: wrap">
      <a href="index.html" style="display: flex; align-items: center; gap: 16px; text-decoration: none; color: #2F2E3F">
        <img src="assets/logo-midnight.png" alt="Wates Construction" style="height: 42px; width: auto">
        <span style="width: 1px; height: 32px; background: #D9D4C7" aria-hidden="true"></span>
        <span style="font-weight: 800; font-size: 18px">Events at Wates</span>
      </a>
      <nav aria-label="Main" style="display: flex; gap: 24px; flex-wrap: wrap; flex: 1 1 auto; font-size: 16px; font-weight: 600">
        <a href="Dashboard.html" style="color: #2F2E3F; text-decoration: none">My events</a>
        <a href="Tokens.html" style="color: #2F2E3F; text-decoration: none">My credits</a>
        <a href="Interest.html" aria-current="page" style="color: #2F2E3F; text-decoration: none; border-bottom: 3px solid #008FA8; padding-bottom: 4px">Suggest an event</a>
        <a href="Feedback.html" style="color: #2F2E3F; text-decoration: none">Feedback</a>
      </nav>
      <a href="Tokens.html" style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; border-radius: 999px; background: #F9E569; color: #2F2E3F; font-weight: 800; font-size: 15px; text-decoration: none"><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; background: #2F2E3F; color: #F9E569; display: inline-flex; align-items: center; justify-content: center; font-size: 12px">W</span>9 credits left</a>
      <a href="Tokens.html" aria-label="Your account: Rico Cacciatore" style="width: 44px; height: 44px; border-radius: 50%; background: #2F2E3F; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; text-decoration: none">RC</a>
    </div>
  </header>

  <main style="max-width: 1280px; margin: 0 auto; padding: 48px 32px 80px">
    <p style="margin: 0 0 8px; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #004156">Shape what’s on</p>
    <h1 style="margin: 0; font-size: 52px; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em">Register interest or suggest an event</h1>
    <p style="margin: 12px 0 0; font-family: 'Lora', Georgia, serif; font-size: 22px; line-height: 1.45; color: #004156; max-width: 820px">Tell Wates Next Gen what you want to go to. Interest helps us decide what to run, and nothing is taken from your credits until you book.</p>

    <div style="margin-top: 36px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

      <!-- register interest -->
      <section aria-labelledby="ri" style="flex: 1 1 400px; min-width: 0; background: #FFFFFF; border-radius: 28px; padding: 32px">
        <h2 id="ri" style="margin: 0 0 6px; font-size: 26px; font-weight: 800">Register interest</h2>
        <p style="margin: 0 0 20px; font-size: 16px; color: #4B4A5C">For events that aren’t open for booking yet, or are full.</p>
        <template data-sc="if" value="{{ notSent1 }}">
          <form style="display: flex; flex-direction: column; gap: 18px">
            <div style="display: flex; flex-direction: column; gap: 8px">
              <label for="ev" style="font-size: 15px; font-weight: 700">Which event?</label>
              <select id="ev" style="min-height: 52px; padding: 0 14px; border-radius: 14px; border: 2px solid #D9D4C7; background: #FAF8F3; font-family: inherit; font-size: 16px; color: #2F2E3F">
                <option>London’s next chapter: market panel (Wed 20 Jan)</option>
                <option>Building sustainably: low-carbon site visit (spring 2027)</option>
                <option>Delivering excellence: client panel (date to be set)</option>
              </select>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px">
              <label for="meet" style="font-size: 15px; font-weight: 700">Who would you most like to meet there? <span style="font-weight: 500; color: #4B4A5C">(optional)</span></label>
              <textarea id="meet" rows="3" style="padding: 12px 14px; border-radius: 14px; border: 2px solid #D9D4C7; background: #FAF8F3; font-family: inherit; font-size: 16px; color: #2F2E3F; resize: vertical">A client or consultant you’d like the organisers to invite</textarea>
            </div>
            <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
              <legend style="font-size: 15px; font-weight: 700; margin-bottom: 8px">Let me know</legend>
              <label style="display: flex; gap: 10px; align-items: center; font-size: 16px; min-height: 32px"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #2F2E3F">When booking opens</label>
              <label style="display: flex; gap: 10px; align-items: center; font-size: 16px; min-height: 32px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #2F2E3F">If a place frees up on the waiting list</label>
            </fieldset>
            <button type="button" onClick="{{ send1 }}" style="min-height: 52px; border-radius: 999px; border: 0; background: #2F2E3F; color: #FFFFFF; font-family: inherit; font-weight: 800; font-size: 16px; cursor: pointer">Register my interest</button>
          </form>
        </template>
        <template data-sc="if" value="{{ sent1 }}">
          <div role="status" style="background: #CDE6A7; border-radius: 20px; padding: 22px">
            <p style="margin: 0; font-size: 20px; font-weight: 800">You’re on the list</p>
            <p style="margin: 8px 0 0; font-size: 16px; line-height: 1.5">We’ll email you when booking opens. No credits have been used.</p>
          </div>
        </template>
      </section>

      <!-- suggest an event -->
      <section aria-labelledby="sg" style="flex: 1 1 520px; min-width: 0; background: #FFFFFF; border-radius: 28px; padding: 32px">
        <h2 id="sg" style="margin: 0 0 6px; font-size: 26px; font-weight: 800">Suggest an event</h2>
        <p style="margin: 0 0 20px; font-size: 16px; color: #4B4A5C">Got an idea, a venue or a client who’d love to come? Tell us.</p>
        <template data-sc="if" value="{{ notSent2 }}">
          <form style="display: flex; flex-direction: column; gap: 18px">
            <fieldset style="border: 0; margin: 0; padding: 0">
              <legend style="font-size: 15px; font-weight: 700; margin-bottom: 10px">Type of event</legend>
              <div style="display: flex; flex-wrap: wrap; gap: 10px">
                <label style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; background: #CDE6A7; font-size: 15px; font-weight: 600"><input type="radio" name="type" checked style="accent-color: #2F2E3F">Sports and social</label>
                <label style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; background: #F7C8B3; font-size: 15px; font-weight: 600"><input type="radio" name="type" style="accent-color: #2F2E3F">Drinks and dinner</label>
                <label style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; background: #F9E569; font-size: 15px; font-weight: 600"><input type="radio" name="type" style="accent-color: #2F2E3F">Site visit</label>
                <label style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; background: #C1D1FF; font-size: 15px; font-weight: 600"><input type="radio" name="type" style="accent-color: #2F2E3F">Thought leadership</label>
                <label style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; background: #FFC66C; font-size: 15px; font-weight: 600"><input type="radio" name="type" style="accent-color: #2F2E3F">Conference</label>
              </div>
            </fieldset>
            <div style="display: flex; flex-direction: column; gap: 8px">
              <label for="idea" style="font-size: 15px; font-weight: 700">Your idea</label>
              <textarea id="idea" rows="3" style="padding: 12px 14px; border-radius: 14px; border: 2px solid #D9D4C7; background: #FAF8F3; font-family: inherit; font-size: 16px; color: #2F2E3F; resize: vertical">What, where and roughly when</textarea>
            </div>
            <fieldset style="border: 0; margin: 0; padding: 0">
              <legend style="font-size: 15px; font-weight: 700; margin-bottom: 10px">Who should we invite?</legend>
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px">
                <label style="display: flex; gap: 10px; align-items: center; font-size: 16px; min-height: 32px"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #2F2E3F">Clients</label>
                <label style="display: flex; gap: 10px; align-items: center; font-size: 16px; min-height: 32px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #2F2E3F">Project managers</label>
                <label style="display: flex; gap: 10px; align-items: center; font-size: 16px; min-height: 32px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #2F2E3F">Cost consultants</label>
                <label style="display: flex; gap: 10px; align-items: center; font-size: 16px; min-height: 32px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #2F2E3F">Design consultants</label>
                <label style="display: flex; gap: 10px; align-items: center; font-size: 16px; min-height: 32px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #2F2E3F">Supply chain partners (as co-hosts)</label>
              </div>
            </fieldset>
            <label style="display: flex; gap: 10px; align-items: center; font-size: 16px; min-height: 32px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #2F2E3F">I’d like to help organise it</label>
            <button type="button" onClick="{{ send2 }}" style="min-height: 52px; border-radius: 999px; border: 0; background: #2F2E3F; color: #FFFFFF; font-family: inherit; font-weight: 800; font-size: 16px; cursor: pointer">Send my idea to Wates Next Gen</button>
          </form>
        </template>
        <template data-sc="if" value="{{ sent2 }}">
          <div role="status" style="background: #CDE6A7; border-radius: 20px; padding: 22px">
            <p style="margin: 0; font-size: 20px; font-weight: 800">Thanks, idea received</p>
            <p style="margin: 8px 0 0; font-size: 16px; line-height: 1.5">It’s now on the ideas board below so colleagues can show their interest.</p>
          </div>
        </template>
      </section>
    </div>

    <!-- ideas board -->
    <section aria-labelledby="board" style="margin-top: 48px">
      <h2 id="board" style="margin: 0; font-size: 32px; font-weight: 800">Most wanted</h2>
      <p style="margin: 8px 0 20px; font-size: 16px; color: #4B4A5C">Ideas from colleagues. The most popular go into next quarter’s calendar.</p>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px">
        <template data-sc="for" list="{{ ideas }}" as="i">
          <div style="background: #FFFFFF; border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 12px">
            <p style="margin: 0; display: inline-flex; align-self: flex-start; padding: 6px 12px; border-radius: 999px; background: {{ i.colour }}; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase">{{ i.type }}</p>
            <p style="margin: 0; font-size: 19px; font-weight: 700; line-height: 1.3">{{ i.title }}</p>
            <div style="margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px">
              <span style="font-size: 15px; font-weight: 600; color: #4B4A5C">{{ i.count }} interested</span>
              <button type="button" onClick="{{ i.toggle }}" aria-pressed="{{ i.pressed }}" style="{{ i.btnStyle }}">{{ i.btnLabel }}</button>
            </div>
          </div>
        </template>
      </div>
    </section>
  </main>
</div>
</template>
<script type="text/plain" id="logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sent1: false, sent2: false, voted: {} };
  }
  renderVals() {
    var self = this;
    var voted = this.state.voted;
    var base = [
      { id: 'a', type: 'Site visit', colour: '#F9E569', title: 'Building sustainably: tour a low-carbon scheme with the design team', count: 23 },
      { id: 'b', type: 'Sports and social', colour: '#CDE6A7', title: 'Summer golf day with clients and consultants', count: 17 },
      { id: 'c', type: 'Thought leadership', colour: '#C1D1FF', title: 'Delivering excellence: a client panel on what great looks like', count: 12 }
    ];
    var ideas = base.map(function (i) {
      var on = !!voted[i.id];
      return {
        type: i.type, colour: i.colour, title: i.title,
        count: i.count + (on ? 1 : 0),
        pressed: on ? 'true' : 'false',
        btnLabel: on ? 'You’re interested' : 'I’m interested',
        btnStyle: 'min-height: 44px; padding: 0 16px; border-radius: 999px; font-family: inherit; font-weight: 700; font-size: 15px; cursor: pointer; ' + (on ? 'background: #2F2E3F; color: #FFFFFF; border: 2px solid #2F2E3F' : 'background: #FFFFFF; color: #2F2E3F; border: 2px solid #2F2E3F'),
        toggle: function () { var v = Object.assign({}, self.state.voted); v[i.id] = !v[i.id]; self.setState({ voted: v }); }
      };
    });
    return {
      sent1: this.state.sent1, notSent1: !this.state.sent1,
      sent2: this.state.sent2, notSent2: !this.state.sent2,
      send1: function () { self.setState({ sent1: true }); },
      send2: function () { self.setState({ sent2: true }); },
      ideas: ideas
    };
  }
}
</script>
<div class="preview-tag" aria-hidden="true">Concept preview · sample content</div>
<script src="dc.js"></script>
</body>
</html>
