<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Events at Wates</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Lora:ital,wght@0,400;0,500;1,400;1,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF8F3;color:#2F2E3F;font-family:'Figtree',system-ui,sans-serif}
a{color:#004156}a:hover{color:#2F2E3F}
</style>

<style>body{margin:0}
.preview-tag{position:fixed;left:12px;bottom:12px;z-index:50;padding:8px 14px;border-radius:999px;background:#F9E569;color:#2F2E3F;font:700 13px Figtree,system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.2);pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Lora:ital,wght@0,400;0,500;1,400;1,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF8F3;color:#2F2E3F;font-family:'Figtree',system-ui,sans-serif}
a{color:#004156}a:hover{color:#2F2E3F}
</style>
</helmet>
<div style="font-family: 'Figtree', system-ui, sans-serif; color: #2F2E3F; background: #FAF8F3; min-height: 100vh">

  <!-- header -->
  <header style="background: #FFFFFF; border-bottom: 1px solid #E6E1D6">
    <div style="max-width: 1280px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; gap: 32px; flex-wrap: wrap">
      <a href="index.html" style="display: flex; align-items: center; gap: 16px; text-decoration: none; color: #2F2E3F">
        <img src="assets/logo-midnight.png" alt="Wates Construction" style="height: 42px; width: auto">
        <span style="width: 1px; height: 32px; background: #D9D4C7" aria-hidden="true"></span>
        <span style="font-weight: 800; font-size: 18px; letter-spacing: -0.01em">Events at Wates</span>
      </a>
      <nav aria-label="Main" style="display: flex; gap: 28px; flex-wrap: wrap; flex: 1 1 auto; font-size: 16px; font-weight: 600">
        <a href="#events" style="color: #2F2E3F; text-decoration: none">Upcoming events</a>
        <a href="#credits" style="color: #2F2E3F; text-decoration: none">How credits work</a>
        <a href="Interest.html" style="color: #2F2E3F; text-decoration: none">Suggest an event</a>
        <a href="#about" style="color: #2F2E3F; text-decoration: none">About Wates Next Gen</a>
      </nav>
      <a href="SignIn.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 22px; border-radius: 999px; border: 2px solid #2F2E3F; color: #2F2E3F; font-weight: 700; font-size: 15px; text-decoration: none">Sign in</a>
    </div>
  </header>

  <!-- hero -->
  <section style="background: #2F2E3F; color: #FFFFFF; position: relative; overflow: hidden">
    <svg aria-hidden="true" viewBox="0 0 1440 600" preserveAspectRatio="xMaxYMid slice" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none">
      <path d="M-20 585 C 180 560, 320 598, 520 580 S 800 566, 900 540 S 1100 470, 1180 420 S 1230 300, 1270 268" fill="none" stroke="#008FA8" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"></path><g transform="translate(1262 256) rotate(-14) scale(1.1)"><path d="M4 18 C40 4 100 0 146 6 C108 10 80 20 60 36 C52 28 42 24 30 28 C20 28 10 24 4 18Z" fill="#9FD6E6" opacity=".75"/><path d="M4 18 C10 24 20 28 30 28 C42 24 52 28 60 36 C70 22 90 12 118 7 C80 6 40 8 4 18Z" fill="#00A9C6"/><path d="M4 18 C40 4 100 0 146 6 C110 5 70 6 36 16 C24 18 14 18 4 18Z" fill="#C1D1FF"/></g>
    </svg>
    <div style="position: relative; max-width: 1280px; margin: 0 auto; padding: 88px 32px 72px; display: flex; flex-wrap: wrap; align-items: center; gap: 48px">
      <div style="flex: 1 1 520px; min-width: 0">
        <p style="margin: 0 0 20px; font-size: 15px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #C1D1FF">Wates Next Gen presents</p>
        <h1 style="margin: 0; font-size: clamp(56px, 8vw, 112px); line-height: 0.95; font-weight: 800; letter-spacing: -0.03em">Events <span style="font-family: 'Lora', Georgia, serif; font-style: italic; font-weight: 400; color: #F9E569">at</span> Wates</h1>
        <p style="margin: 28px 0 0; font-family: 'Lora', Georgia, serif; font-size: 26px; line-height: 1.35; color: #FFFFFF; max-width: 560px">Meet the people who shape what we build.</p>
        <p style="margin: 16px 0 0; font-size: 18px; line-height: 1.6; color: #E4E2EC; max-width: 560px">Socials, site tours and thought-leadership sessions with clients, consultants and project managers, open to everyone at Wates. Everyone at Wates has 12 hours of dedicated networking time each year, and credits make it easy to see how you’re using it.</p>
        <div style="display: flex; gap: 14px; flex-wrap: wrap; margin-top: 36px">
          <a href="#events" style="display: inline-flex; align-items: center; min-height: 52px; padding: 0 28px; border-radius: 999px; background: #F9E569; color: #2F2E3F; font-weight: 800; font-size: 17px; text-decoration: none">See what’s on</a>
          <a href="#credits" style="display: inline-flex; align-items: center; min-height: 52px; padding: 0 28px; border-radius: 999px; border: 2px solid #FFFFFF; color: #FFFFFF; font-weight: 700; font-size: 17px; text-decoration: none">How credits work</a>
        </div>
      </div>
      <div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 22px">
        <img src="assets/building.png" alt="" style="width: 100%; max-width: 440px; height: auto">
        <div style="width: 100%; max-width: 520px; background: rgba(255,255,255,0.07); border: 1px solid #5A5972; border-radius: 28px; padding: 22px 22px 24px">
          <p style="margin: 0; font-family: 'Lora', Georgia, serif; font-style: italic; font-size: 24px; line-height: 1.2; color: #FFFFFF">You told us relationships matter</p>
          <div style="margin-top: 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px">
            <div style="background: #2F2E3F; border-radius: 18px; padding: 14px 12px; border-top: 4px solid #F9E569"><p style="margin: 0; font-size: 34px; line-height: 1; font-weight: 800; color: #F9E569">8.9</p><p style="margin: 8px 0 0; font-size: 13px; line-height: 1.4; color: #E4E2EC">out of 10: how important networking is to winning work</p></div>
            <div style="background: #2F2E3F; border-radius: 18px; padding: 14px 12px; border-top: 4px solid #C1D1FF"><p style="margin: 0; font-size: 34px; line-height: 1; font-weight: 800; color: #C1D1FF">1 in 5</p><p style="margin: 8px 0 0; font-size: 13px; line-height: 1.4; color: #E4E2EC">did no external networking at all last year</p></div>
            <div style="background: #2F2E3F; border-radius: 18px; padding: 14px 12px; border-top: 4px solid #CDE6A7"><p style="margin: 0; font-size: 34px; line-height: 1; font-weight: 800; color: #CDE6A7">91%</p><p style="margin: 8px 0 0; font-size: 13px; line-height: 1.4; color: #E4E2EC">would use dedicated networking time if they had it</p></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- upcoming events -->
  <section id="events" style="max-width: 1280px; margin: 0 auto; padding: 80px 32px 40px">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap">
      <div>
        <p style="margin: 0 0 10px; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #004156">Coming up</p>
        <h2 style="margin: 0; font-size: 48px; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em">Upcoming events</h2>
      </div>
      <div role="group" aria-label="Filter by event type" style="display: flex; gap: 10px; flex-wrap: wrap">
        <template data-sc="for" list="{{ types }}" as="t">
          <button type="button" onClick="{{ t.pick }}" aria-pressed="{{ t.pressed }}" style="{{ t.chipStyle }}">{{ t.label }}</button>
        </template>
      </div>
    </div>

    <div style="margin-top: 36px; display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 24px">
      <template data-sc="for" list="{{ events }}" as="ev">
        <article style="background: #FFFFFF; border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 1px 0 #E6E1D6">
          <div style="background: {{ ev.colour }}; padding: 22px 24px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
            <div>
              <p style="margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase">{{ ev.typeLabel }}</p>
              <p style="margin: 10px 0 0; font-size: 44px; line-height: 1; font-weight: 800">{{ ev.day }} <span style="font-size: 22px; font-weight: 700">{{ ev.mon }}</span></p>
              <p style="margin: 6px 0 0; font-size: 15px; font-weight: 600">{{ ev.weekday }}</p>
            </div>
            <div style="background: #2F2E3F; color: #FFFFFF; border-radius: 16px; padding: 10px 14px; text-align: center; min-width: 64px">
              <p style="margin: 0; font-size: 26px; font-weight: 800; line-height: 1">{{ ev.credits }}</p>
              <p style="margin: 4px 0 0; font-size: 12px; font-weight: 600">credits</p>
            </div>
          </div>
          <div style="padding: 22px 24px 24px; display: flex; flex-direction: column; gap: 10px; flex: 1 1 auto">
            <h3 style="margin: 0; font-size: 22px; line-height: 1.25; font-weight: 700">{{ ev.title }}</h3>
            <p style="margin: 0; font-size: 16px; color: #4B4A5C">{{ ev.time }}  ·  {{ ev.place }}</p>
            <p style="margin: 0; font-size: 15px; color: #4B4A5C">About {{ ev.credits }} hours of dedicated time  ·  {{ ev.spaces }}</p>
            <div style="margin-top: auto; padding-top: 14px">
              <a href="SignIn.html" style="display: inline-flex; align-items: center; min-height: 46px; padding: 0 22px; border-radius: 999px; background: #2F2E3F; color: #FFFFFF; font-weight: 700; font-size: 15px; text-decoration: none">{{ ev.cta }}</a>
            </div>
          </div>
        </article>
      </template>
    </div>
  </section>

  <!-- how credits work -->
  <section id="credits" style="max-width: 1280px; margin: 0 auto; padding: 60px 32px">
    <div style="background: #FFFFFF; border-radius: 32px; padding: 56px 48px">
      <p style="margin: 0 0 10px; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #004156">How credits work</p>
      <h2 style="margin: 0; font-size: 44px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em">One credit = one hour of dedicated time</h2>
      <p style="margin: 16px 0 0; font-family: 'Lora', Georgia, serif; font-size: 22px; line-height: 1.45; color: #004156; max-width: 760px">Credits are simply a way to keep track of your dedicated networking time. Each event uses roughly the hours it takes, so you can see at a glance how you’re investing your time.</p>
      <div style="margin-top: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px">
        <div style="background: #C1D1FF; border-radius: 24px; padding: 28px">
          <p style="margin: 0; font-size: 40px; font-weight: 800">01</p>
          <h3 style="margin: 14px 0 8px; font-size: 20px; font-weight: 700">See your dedicated time</h3>
          <p style="margin: 0; font-size: 16px; line-height: 1.55">Everyone has 12 hours a year. Senior managers and directors have a little extra, so they can host as well as attend.</p>
        </div>
        <div style="background: #F9E569; border-radius: 24px; padding: 28px">
          <p style="margin: 0; font-size: 40px; font-weight: 800">02</p>
          <h3 style="margin: 14px 0 8px; font-size: 20px; font-weight: 700">Book an event</h3>
          <p style="margin: 0; font-size: 16px; line-height: 1.55">Your line manager gives it a quick approval, and the hours are set aside for you until the day.</p>
        </div>
        <div style="background: #CDE6A7; border-radius: 24px; padding: 28px">
          <p style="margin: 0; font-size: 40px; font-weight: 800">03</p>
          <h3 style="margin: 14px 0 8px; font-size: 20px; font-weight: 700">Turn up and check in</h3>
          <p style="margin: 0; font-size: 16px; line-height: 1.55">Check in on your phone at the event. That confirms your attendance.</p>
        </div>
        <div style="background: #F7C8B3; border-radius: 24px; padding: 28px">
          <p style="margin: 0; font-size: 40px; font-weight: 800">04</p>
          <h3 style="margin: 14px 0 8px; font-size: 20px; font-weight: 700">Can’t make it? Let us know</h3>
          <p style="margin: 0; font-size: 16px; line-height: 1.55">Plans change. Cancel 48 hours or more before and your credits go straight back. If you can’t make it and haven’t cancelled, the hours are released so someone else can come.</p>
        </div>
      </div>
      <div style="margin-top: 32px; display: flex; flex-wrap: wrap; gap: 12px">
        <span style="display: inline-flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 999px; background: #FAF8F3; font-size: 15px; font-weight: 600"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #C1D1FF; border: 1px solid #2F2E3F"></span>Thought leadership · 2 credits</span>
        <span style="display: inline-flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 999px; background: #FAF8F3; font-size: 15px; font-weight: 600"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #F9E569; border: 1px solid #2F2E3F"></span>Site visit · 2 credits</span>
        <span style="display: inline-flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 999px; background: #FAF8F3; font-size: 15px; font-weight: 600"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #CDE6A7; border: 1px solid #2F2E3F"></span>Sports and social · 3 credits</span>
        <span style="display: inline-flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 999px; background: #FAF8F3; font-size: 15px; font-weight: 600"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #F7C8B3; border: 1px solid #2F2E3F"></span>Drinks and dinner · 3 credits</span>
        <span style="display: inline-flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 999px; background: #FAF8F3; font-size: 15px; font-weight: 600"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #FFC66C; border: 1px solid #2F2E3F"></span>Conference · 6 credits</span>
      </div>
    </div>
  </section>

  <!-- about -->
  <section id="about" style="max-width: 1280px; margin: 0 auto; padding: 24px 32px 72px">
    <div style="max-width: 760px">
      <p style="margin: 0 0 10px; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #004156">About Wates Next Gen</p>
      <h2 style="margin: 0; font-size: 44px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em">Run by colleagues, open to everyone</h2>
      <p style="margin: 16px 0 0; font-size: 18px; line-height: 1.6">Events at Wates is run by Wates Next Gen, a colleague-led group from every level of the business. We put on events with clients, consultants and project managers, and make it easy for you to come along.</p>
    </div>
  </section>

  <!-- who you'll meet -->
  <section style="background: #FFFFFF">
    <div style="max-width: 1280px; margin: 0 auto; padding: 72px 32px 56px; text-align: center">
      <p style="margin: 0 0 10px; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #004156">Who you’ll meet</p>
      <h2 style="margin: 0; font-size: 44px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em">Clients, consultants and project managers</h2>
      <img src="assets/people.png" alt="Line illustration of colleagues and guests talking at a networking event" style="width: 100%; max-width: 1100px; height: auto; margin: 32px auto 0; display: block">
    </div>
  </section>

  <!-- footer -->
  <footer style="background: #2F2E3F; color: #FFFFFF">
    <div style="max-width: 1280px; margin: 0 auto; padding: 48px 32px; display: flex; flex-wrap: wrap; gap: 32px; justify-content: space-between; align-items: flex-end">
      <div>
        <img src="assets/logo-white.png" alt="Wates Construction" style="height: 52px; width: auto">
        <p style="margin: 16px 0 0; font-size: 16px; color: #E4E2EC">Events at Wates is run by Wates Next Gen for the London business.</p>
      </div>
      <nav aria-label="Footer" style="display: flex; gap: 24px; flex-wrap: wrap; font-size: 15px; font-weight: 600">
        <a href="Interest.html" style="color: #FFFFFF">Suggest an event</a>
        <a href="Feedback.html" style="color: #FFFFFF">Give feedback</a>
        <a href="#credits" style="color: #FFFFFF">Credit rules</a>
        <a href="#about" style="color: #FFFFFF">Hospitality policy</a>
      </nav>
      <p style="margin: 0; font-family: 'Lora', Georgia, serif; font-size: 20px; color: #C1D1FF">Reimagining places for people to thrive</p>
    </div>
  </footer>
</div>
</template>
<script type="text/plain" id="logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all' };
  }
  renderVals() {
    var TYPES = {
      tl: { label: 'Thought leadership', colour: '#C1D1FF' },
      site: { label: 'Site visit', colour: '#F9E569' },
      social: { label: 'Sports and social', colour: '#CDE6A7' },
      drinks: { label: 'Drinks and dinner', colour: '#F7C8B3' },
      conf: { label: 'Conference', colour: '#FFC66C' }
    };
    var all = [
      { day: '12', mon: 'Nov', weekday: 'Thursday', type: 'tl', title: 'Building in the age of AI: breakfast roundtable', time: '08:00–10:00', place: 'The Foundry Rooms, Southwark, London', credits: 2, spaces: '6 places left', cta: 'Sign in to book' },
      { day: '18', mon: 'Nov', weekday: 'Wednesday', type: 'site', title: 'Site tour of 56 Bishops Avenue and talks from selected product manufacturers such as IGMS', time: '14:00–16:00', place: '56 Bishops Avenue, London N2', credits: 2, spaces: '9 places left', cta: 'Sign in to book' },
      { day: '20', mon: 'Nov', weekday: 'Friday', type: 'conf', title: 'London Construction Leaders Summit', time: '09:00–15:00', place: 'The Brewery, Chiswell Street, London', credits: 6, spaces: '4 places left', cta: 'Sign in to book' },
      { day: '26', mon: 'Nov', weekday: 'Thursday', type: 'social', title: 'Five-a-side with clients and consultants', time: '18:00–21:00', place: 'Canal Street Sports Club, King’s Cross, London', credits: 3, spaces: '12 places left', cta: 'Sign in to book' },
      { day: '1', mon: 'Dec', weekday: 'Tuesday', type: 'drinks', title: 'Winter drinks with our consultant partners', time: '18:00–21:00', place: 'The Albion Rooftop, Shoreditch, London', credits: 3, spaces: '20 places left', cta: 'Sign in to book' },
      { day: '20', mon: 'Jan', weekday: 'Wednesday', type: 'tl', title: 'London’s next chapter: market panel', time: '17:30–19:30', place: 'The Pearson Hall, Holborn, London', credits: 2, spaces: 'Booking opens 1 Dec', cta: 'Sign in to register interest' }
    ];
    var self = this;
    var f = this.state.filter;
    var events = all.filter(function (e) { return f === 'all' || e.type === f; }).map(function (e) {
      return Object.assign({}, e, { typeLabel: TYPES[e.type].label, colour: TYPES[e.type].colour });
    });
    var chipBase = 'min-height: 44px; padding: 0 18px; border-radius: 999px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; ';
    var keys = ['all', 'tl', 'site', 'social', 'drinks', 'conf'];
    var types = keys.map(function (k) {
      var on = f === k;
      return {
        label: k === 'all' ? 'All events' : TYPES[k].label,
        pressed: on ? 'true' : 'false',
        chipStyle: chipBase + (on ? 'background: #2F2E3F; color: #FFFFFF; border: 2px solid #2F2E3F' : 'background: #FFFFFF; color: #2F2E3F; border: 2px solid #D9D4C7'),
        pick: function () { self.setState({ filter: k }); }
      };
    });
    return { events: events, types: types };
  }
}
</script>
<div class="preview-tag" aria-hidden="true">Concept preview · sample content</div>
<script src="dc.js"></script>
</body>
</html>
