<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Event feedback – Events at Wates</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Lora:ital,wght@0,400;0,500;1,400;1,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF8F3;color:#2F2E3F;font-family:'Figtree',system-ui,sans-serif}
a{color:#004156}a:hover{color:#2F2E3F}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #008FA8;outline-offset:2px}
</style>

<style>body{margin:0}
.preview-tag{position:fixed;left:12px;bottom:12px;z-index:50;padding:8px 14px;border-radius:999px;background:#F9E569;color:#2F2E3F;font:700 13px Figtree,system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.2);pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Lora:ital,wght@0,400;0,500;1,400;1,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF8F3;color:#2F2E3F;font-family:'Figtree',system-ui,sans-serif}
a{color:#004156}a:hover{color:#2F2E3F}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #008FA8;outline-offset:2px}
</style>
</helmet>
<div style="font-family: 'Figtree', system-ui, sans-serif; color: #2F2E3F; background: #FAF8F3; min-height: 100vh">

  <header style="background: #FFFFFF; border-bottom: 1px solid #E6E1D6">
    <div style="max-width: 1280px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; gap: 28px; flex-wrap: wrap">
      <a href="index.html" style="display: flex; align-items: center; gap: 16px; text-decoration: none; color: #2F2E3F">
        <img src="assets/logo-midnight.png" alt="Wates Construction" style="height: 42px; width: auto">
        <span style="width: 1px; height: 32px; background: #D9D4C7" aria-hidden="true"></span>
        <span style="font-weight: 800; font-size: 18px">Events at Wates</span>
      </a>
      <nav aria-label="Main" style="display: flex; gap: 24px; flex-wrap: wrap; flex: 1 1 auto; font-size: 16px; font-weight: 600">
        <a href="Dashboard.html" style="color: #2F2E3F; text-decoration: none">My events</a>
        <a href="Tokens.html" style="color: #2F2E3F; text-decoration: none">My credits</a>
        <a href="Interest.html" style="color: #2F2E3F; text-decoration: none">Suggest an event</a>
        <a href="Feedback.html" aria-current="page" style="color: #2F2E3F; text-decoration: none; border-bottom: 3px solid #008FA8; padding-bottom: 4px">Feedback</a>
      </nav>
      <a href="Tokens.html" style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; border-radius: 999px; background: #F9E569; color: #2F2E3F; font-weight: 800; font-size: 15px; text-decoration: none"><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; background: #2F2E3F; color: #F9E569; display: inline-flex; align-items: center; justify-content: center; font-size: 12px">W</span>9 credits left</a>
      <a href="Tokens.html" aria-label="Your account: Rico Cacciatore" style="width: 44px; height: 44px; border-radius: 50%; background: #2F2E3F; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; text-decoration: none">RC</a>
    </div>
  </header>

  <main style="max-width: 1280px; margin: 0 auto; padding: 48px 32px 80px; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">

    <div style="flex: 999 1 600px; min-width: 0">
      <p style="margin: 0 0 8px; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #004156">Feedback</p>
      <h1 style="margin: 0; font-size: 48px; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em">How was the charity quiz night?</h1>
      <p style="margin: 12px 0 0; font-family: 'Lora', Georgia, serif; font-size: 21px; line-height: 1.45; color: #004156">Two minutes now helps us prove the value of networking time, and makes the next event better.</p>

      <template data-sc="if" value="{{ notSent }}">
        <form style="margin-top: 32px; background: #FFFFFF; border-radius: 28px; padding: 36px; display: flex; flex-direction: column; gap: 30px">

          <fieldset style="border: 0; margin: 0; padding: 0">
            <legend style="font-size: 18px; font-weight: 800; margin-bottom: 14px">1. Overall, how was it?</legend>
            <div style="display: flex; gap: 10px; flex-wrap: wrap">
              <template data-sc="for" list="{{ ratings }}" as="r">
                <button type="button" onClick="{{ r.pick }}" aria-pressed="{{ r.pressed }}" aria-label="{{ r.aria }}" style="{{ r.style }}">{{ r.n }}</button>
              </template>
            </div>
            <p style="margin: 10px 0 0; font-size: 14px; color: #4B4A5C">1 = not for me, 5 = brilliant</p>
          </fieldset>

          <fieldset style="border: 0; margin: 0; padding: 0">
            <legend style="font-size: 18px; font-weight: 800; margin-bottom: 14px">2. Was it worth the 3 credits?</legend>
            <div style="display: flex; gap: 10px; flex-wrap: wrap">
              <label style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid #D9D4C7; font-size: 16px; font-weight: 600"><input type="radio" name="worth" checked style="accent-color: #2F2E3F">Yes, definitely</label>
              <label style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid #D9D4C7; font-size: 16px; font-weight: 600"><input type="radio" name="worth" style="accent-color: #2F2E3F">Partly</label>
              <label style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid #D9D4C7; font-size: 16px; font-weight: 600"><input type="radio" name="worth" style="accent-color: #2F2E3F">Not really</label>
            </div>
          </fieldset>

          <fieldset style="border: 0; margin: 0; padding: 0">
            <legend style="font-size: 18px; font-weight: 800; margin-bottom: 6px">3. Who did you meet?</legend>
            <p style="margin: 0 0 14px; font-size: 15px; color: #4B4A5C">New contacts are added to your PDR activity log. Only you and your line manager can see them.</p>
            <div style="display: flex; flex-direction: column; gap: 12px">
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px">
                <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Name<input type="text" style="min-height: 48px; padding: 0 12px; border-radius: 12px; border: 2px solid #D9D4C7; background: #FAF8F3; font-family: inherit; font-size: 16px"></label>
                <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Organisation<input type="text" style="min-height: 48px; padding: 0 12px; border-radius: 12px; border: 2px solid #D9D4C7; background: #FAF8F3; font-family: inherit; font-size: 16px"></label>
                <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">They are a…<select style="min-height: 48px; padding: 0 10px; border-radius: 12px; border: 2px solid #D9D4C7; background: #FAF8F3; font-family: inherit; font-size: 16px; color: #2F2E3F"><option>Client</option><option>Project manager</option><option>Cost consultant</option><option>Design consultant</option><option>Other</option></select></label>
              </div>
              <button type="button" style="align-self: flex-start; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px dashed #2F2E3F; background: transparent; color: #2F2E3F; font-family: inherit; font-weight: 700; font-size: 15px; cursor: pointer">+ Add another person</button>
            </div>
          </fieldset>

          <div style="display: flex; flex-direction: column; gap: 8px">
            <label for="fu" style="font-size: 18px; font-weight: 800">4. Did you agree any follow-ups?</label>
            <textarea id="fu" rows="3" style="padding: 12px 14px; border-radius: 14px; border: 2px solid #D9D4C7; background: #FAF8F3; font-family: inherit; font-size: 16px; color: #2F2E3F; resize: vertical">For example, a coffee, a site visit or an introduction</textarea>
          </div>

          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px">
            <div style="display: flex; flex-direction: column; gap: 8px">
              <label for="good" style="font-size: 18px; font-weight: 800">5. What worked well?</label>
              <textarea id="good" rows="3" style="padding: 12px 14px; border-radius: 14px; border: 2px solid #D9D4C7; background: #FAF8F3; font-family: inherit; font-size: 16px; color: #2F2E3F; resize: vertical"></textarea>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px">
              <label for="better" style="font-size: 18px; font-weight: 800">6. What could be better?</label>
              <textarea id="better" rows="3" style="padding: 12px 14px; border-radius: 14px; border: 2px solid #D9D4C7; background: #FAF8F3; font-family: inherit; font-size: 16px; color: #2F2E3F; resize: vertical"></textarea>
            </div>
          </div>

          <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
            <legend style="font-size: 18px; font-weight: 800; margin-bottom: 8px">7. Anything else</legend>
            <label style="display: flex; gap: 10px; align-items: center; font-size: 16px; min-height: 32px"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #2F2E3F">I’d recommend this kind of event to a colleague</label>
            <label style="display: flex; gap: 10px; align-items: center; font-size: 16px; min-height: 32px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #2F2E3F">You can quote me in the event write-up</label>
          </fieldset>

          <button type="button" onClick="{{ send }}" style="align-self: flex-start; min-height: 54px; padding: 0 32px; border-radius: 999px; border: 0; background: #2F2E3F; color: #FFFFFF; font-family: inherit; font-weight: 800; font-size: 17px; cursor: pointer">Send feedback</button>
        </form>
      </template>
      <template data-sc="if" value="{{ sent }}">
        <div role="status" style="margin-top: 32px; background: #CDE6A7; border-radius: 28px; padding: 36px">
          <p style="margin: 0; font-size: 28px; font-weight: 800">Thank you</p>
          <p style="margin: 10px 0 0; font-size: 17px; line-height: 1.55">Your feedback goes into the event write-up, and any contacts you logged are now in your PDR activity log.</p>
          <a href="Dashboard.html" style="display: inline-flex; align-items: center; margin-top: 18px; min-height: 48px; padding: 0 22px; border-radius: 999px; background: #2F2E3F; color: #FFFFFF; font-weight: 800; font-size: 15px; text-decoration: none">Back to my events</a>
        </div>
      </template>
    </div>

    <aside style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
      <div style="background: #CDE6A7; border-radius: 28px; padding: 28px">
        <p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">Sports and social</p>
        <p style="margin: 10px 0 0; font-size: 22px; font-weight: 800; line-height: 1.25">Charity quiz night with consultants</p>
        <p style="margin: 8px 0 0; font-size: 15px">Thursday 15 October  ·  3 credits used</p>
        <p style="margin: 8px 0 0; font-size: 15px">Checked in at 18:12</p>
      </div>
      <div style="background: #2F2E3F; color: #FFFFFF; border-radius: 28px; padding: 28px">
        <p style="margin: 0; font-size: 18px; font-weight: 800">Why we ask</p>
        <p style="margin: 10px 0 0; font-size: 15px; line-height: 1.6; color: #E4E2EC">Every event gets a short write-up shared across the business. Your answers also feed the quarterly report showing what the 12 hours of networking time is achieving.</p>
      </div>
    </aside>
  </main>
</div>
</template>
<script type="text/plain" id="logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { rating: 4, sent: false };
  }
  renderVals() {
    var self = this;
    var ratings = [1, 2, 3, 4, 5].map(function (n) {
      var on = self.state.rating === n;
      return {
        n: String(n),
        aria: 'Rate ' + n + ' out of 5',
        pressed: on ? 'true' : 'false',
        style: 'width: 56px; height: 56px; border-radius: 50%; font-family: inherit; font-size: 20px; font-weight: 800; cursor: pointer; ' + (on ? 'background: #F9E569; color: #2F2E3F; border: 2px solid #2F2E3F' : 'background: #FFFFFF; color: #2F2E3F; border: 2px solid #D9D4C7'),
        pick: function () { self.setState({ rating: n }); }
      };
    });
    return {
      ratings: ratings,
      sent: this.state.sent,
      notSent: !this.state.sent,
      send: function () { self.setState({ sent: true }); }
    };
  }
}
</script>
<div class="preview-tag" aria-hidden="true">Concept preview · sample content</div>
<script src="dc.js"></script>
</body>
</html>
