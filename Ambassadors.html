<body>
<div id="app"></div>
<template id="tpl">
<div style="font-family: 'Figtree', system-ui, sans-serif; color: #2F2E3F; background: #FAF8F3; min-height: 100vh">

  <header style="background: #FFFFFF; border-bottom: 1px solid #E6E1D6">
    <div style="max-width: 1280px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; gap: 28px; flex-wrap: wrap">
      <a href="index.html" style="display: flex; align-items: center; gap: 16px; text-decoration: none; color: #2F2E3F">
        <img src="assets/logo-midnight.png" alt="Wates Construction" style="height: 42px; width: auto">
        <span style="width: 1px; height: 32px; background: #D9D4C7" aria-hidden="true"></span>
        <span style="font-weight: 800; font-size: 18px">Events at Wates</span>
      </a>
      <nav aria-label="Main" style="display: flex; gap: 24px; flex-wrap: wrap; flex: 1 1 auto; font-size: 16px; font-weight: 600">
        <a href="Dashboard.html" style="color: #2F2E3F; text-decoration: none">My events</a>
        <a href="Tokens.html" style="color: #2F2E3F; text-decoration: none">My bookings</a>
        <a href="Interest.html" style="color: #2F2E3F; text-decoration: none">Suggest an event</a>
        <a href="Feedback.html" style="color: #2F2E3F; text-decoration: none">Feedback</a>
        <a href="Ambassadors.html" aria-current="page" style="color: #2F2E3F; text-decoration: none; border-bottom: 3px solid #008FA8; padding-bottom: 4px">Ambassadors</a>
      </nav>
      <a href="Tokens.html" aria-label="Your account: Antony Wadey" style="width: 44px; height: 44px; border-radius: 50%; background: #2F2E3F; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; text-decoration: none">AW</a>
    </div>
  </header>

  <!-- hero -->
  <section style="background: #2F2E3F; color: #FFFFFF; position: relative; overflow: hidden">
    <svg aria-hidden="true" viewBox="0 0 1440 460" preserveAspectRatio="xMaxYMid slice" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none">
      <path d="M560 440 C 760 400, 860 460, 1000 400 S 1150 300, 1180 230 S 1230 150, 1268 118" fill="none" stroke="#008FA8" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"></path><g transform="translate(1262 96) rotate(-16) scale(1.0)"><path d="M4 18 C40 4 100 0 146 6 C108 10 80 20 60 36 C52 28 42 24 30 28 C20 28 10 24 4 18Z" fill="#9FD6E6" opacity=".75"></path><path d="M4 18 C10 24 20 28 30 28 C42 24 52 28 60 36 C70 22 90 12 118 7 C80 6 40 8 4 18Z" fill="#00A9C6"></path><path d="M4 18 C40 4 100 0 146 6 C110 5 70 6 36 16 C24 18 14 18 4 18Z" fill="#C1D1FF"></path></g>
    </svg>
    <div style="position: relative; max-width: 1280px; margin: 0 auto; padding: 72px 32px 64px">
      <p style="margin: 0; display: inline-block; padding: 8px 14px; border-radius: 999px; background: #F9E569; color: #2F2E3F; font-size: 14px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase">Applications open</p>
      <h1 style="margin: 22px 0 0; font-size: clamp(48px, 6vw, 84px); line-height: 1; font-weight: 800; letter-spacing: -0.03em; max-width: 900px">Call for Wates <span style="font-family: 'Lora', Georgia, serif; font-style: italic; font-weight: 400; color: #F9E569">Ambassadors</span></h1>
      <p style="margin: 22px 0 0; font-family: 'Lora', Georgia, serif; font-size: 24px; line-height: 1.45; max-width: 760px">Be the face of Wates in the rooms where our next projects begin.</p>
      <p style="margin: 14px 0 0; font-size: 18px; line-height: 1.6; color: #E4E2EC; max-width: 760px">Wates Ambassadors are a selected cohort of colleagues, from every level of the business, who represent us with the clients, consultants and project managers in our pipeline. You’ll get specific networking training and special access to events with pipeline stakeholders.</p>
      <div style="margin-top: 32px; display: flex; flex-wrap: wrap; gap: 14px">
        <a href="#apply" style="display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 26px; border-radius: 999px; border: 0; background: #F9E569; color: #2F2E3F; font-family: inherit; font-weight: 800; font-size: 16px; cursor: pointer; text-decoration: none">Apply now</a>
        <a href="#how" style="display: inline-flex; align-items: center; min-height: 52px; padding: 0 26px; border-radius: 999px; border: 2px solid #FFFFFF; color: #FFFFFF; font-weight: 700; font-size: 16px; text-decoration: none">How selection works</a>
      </div>
      <dl style="margin: 40px 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; max-width: 900px">
        <div style="border-top: 3px solid #F9E569; padding-top: 12px"><dt style="font-size: 14px; color: #C1D1FF; font-weight: 700">Applications close</dt><dd style="margin: 6px 0 0; font-size: 22px; font-weight: 800">March 2026</dd></div>
        <div style="border-top: 3px solid #C1D1FF; padding-top: 12px"><dt style="font-size: 14px; color: #C1D1FF; font-weight: 700">Wates Group review and applicant selection</dt><dd style="margin: 6px 0 0; font-size: 22px; font-weight: 800">April 2026</dd></div>
        <div style="border-top: 3px solid #CDE6A7; padding-top: 12px"><dt style="font-size: 14px; color: #C1D1FF; font-weight: 700">Targeted training</dt><dd style="margin: 6px 0 0; font-size: 22px; font-weight: 800">May 2026</dd></div>
        <div style="border-top: 3px solid #F7C8B3; padding-top: 12px"><dt style="font-size: 14px; color: #C1D1FF; font-weight: 700">Cohort size</dt><dd style="margin: 6px 0 0; font-size: 22px; font-weight: 800">15–20 per region</dd></div>
      </dl>
    </div>
  </section>

  <main style="max-width: 1280px; margin: 0 auto; padding: 64px 32px 80px; display: flex; flex-direction: column; gap: 64px">

    <!-- why it matters -->
    <section aria-labelledby="why" style="display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start">
      <div style="flex: 1 1 460px; min-width: 0">
        <p style="margin: 0 0 8px; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #004156">Why it matters</p>
        <h2 id="why" style="margin: 0; font-size: 36px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em">Relationships win work</h2>
        <p style="margin: 18px 0 0; font-family: 'Lora', Georgia, serif; font-size: 21px; line-height: 1.5; color: #004156">Clients choose contractors they know and trust. Those relationships are built long before a tender lands, by people who show what Wates is like to work with.</p>
        <p style="margin: 16px 0 0; font-size: 17px; line-height: 1.6">Our ambassadors will be those people. Together they make sure Wates is in the room with the clients, consultants and project managers who shape our pipeline, prepared, on message and following up. It’s how we turn goodwill into new work and contracts.</p>
      </div>
      <div style="flex: 1 1 360px; min-width: 0; background: #2F2E3F; color: #FFFFFF; border-radius: 28px; padding: 32px">
        <p style="margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #C1D1FF">You told us</p>
        <div style="margin-top: 18px; display: flex; flex-direction: column; gap: 18px">
          <div style="border-top: 3px solid #F9E569; padding-top: 12px"><p style="margin: 0; font-size: 40px; font-weight: 800; line-height: 1; color: #F9E569">8.9 <span style="font-size: 18px">/10</span></p><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.45; color: #E4E2EC">how important networking is to Wates winning work</p></div>
          <div style="border-top: 3px solid #C1D1FF; padding-top: 12px"><p style="margin: 0; font-size: 40px; font-weight: 800; line-height: 1; color: #C1D1FF">79%</p><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.45; color: #E4E2EC">want senior leaders to meet staff on progress</p></div>
          <div style="border-top: 3px solid #CDE6A7; padding-top: 12px"><p style="margin: 0; font-size: 40px; font-weight: 800; line-height: 1; color: #CDE6A7">44%</p><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.45; color: #E4E2EC">of colleagues below manager level did no external networking last year. Ambassadors are open to every level.</p></div>
        </div>
      </div>
    </section>

    <!-- what ambassadors do -->
    <section aria-labelledby="do">
      <p style="margin: 0 0 8px; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #004156">The role</p>
      <h2 id="do" style="margin: 0; font-size: 36px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em">What ambassadors do</h2>
      <div style="margin-top: 28px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px">
        <div style="background: #C1D1FF; border-radius: 24px; padding: 28px"><p style="margin: 0; font-size: 40px; font-weight: 800">01</p><h3 style="margin: 14px 0 8px; font-size: 21px; font-weight: 700">Represent Wates</h3><p style="margin: 0; font-size: 16px; line-height: 1.55">Attend key client dinners, invitation-only conferences and industry events on behalf of the business.</p></div>
        <div style="background: #F9E569; border-radius: 24px; padding: 28px"><p style="margin: 0; font-size: 40px; font-weight: 800">02</p><h3 style="margin: 14px 0 8px; font-size: 21px; font-weight: 700">Build target relationships</h3><p style="margin: 0; font-size: 16px; line-height: 1.55">Meet the clients, consultants and project managers we most want to work with, briefed on who they are beforehand.</p></div>
        <div style="background: #CDE6A7; border-radius: 24px; padding: 28px"><p style="margin: 0; font-size: 40px; font-weight: 800">03</p><h3 style="margin: 14px 0 8px; font-size: 21px; font-weight: 700">Report back</h3><p style="margin: 0; font-size: 16px; line-height: 1.55">Log who you met and any follow-ups after each event, so the right people at Wates can act on them.</p></div>
      </div>
    </section>

    <!-- what you get -->
    <section aria-labelledby="get" style="background: #FFFFFF; border-radius: 32px; padding: 48px; display: flex; flex-wrap: wrap; gap: 40px; align-items: center">
      <div style="flex: 1 1 420px; min-width: 0">
        <p style="margin: 0 0 8px; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #004156">What you get</p>
        <h2 id="get" style="margin: 0; font-size: 36px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em">What you get if you’re selected</h2>
        <ul style="margin: 24px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 16px; font-size: 17px; line-height: 1.5">
          <li style="display: flex; gap: 14px"><span aria-hidden="true" style="flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; background: #2F2E3F; color: #F9E569; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800">1</span><span><strong>Special access.</strong> Invitations to ambassador-only events with pipeline stakeholders: the clients, consultants and project managers behind our future work.</span></li>
          <li style="display: flex; gap: 14px"><span aria-hidden="true" style="flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; background: #2F2E3F; color: #F9E569; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800">2</span><span><strong>Specific networking training.</strong> How to network with purpose, who to target and how to follow up, delivered by the business.</span></li>
          <li style="display: flex; gap: 14px"><span aria-hidden="true" style="flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; background: #2F2E3F; color: #F9E569; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800">3</span><span><strong>Target briefings.</strong> Before each special event, a short brief on the people to meet and what to talk about.</span></li>
          <li style="display: flex; gap: 14px"><span aria-hidden="true" style="flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; background: #2F2E3F; color: #F9E569; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800">4</span><span><strong>Visibility and growth.</strong> Work alongside senior leaders, build a network you’ll carry through your career, and have your contribution recognised in your PDR.</span></li>
        </ul>
      </div>
      <img src="assets/people.png" alt="Line illustration of colleagues and guests talking at a networking event" style="flex: 1 1 380px; min-width: 0; width: 100%; max-width: 560px; height: auto">
    </section>

    <!-- portal comparison -->
    <section aria-labelledby="compare">
      <p style="margin: 0 0 8px; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #004156">Two portals</p>
      <h2 id="compare" style="margin: 0; font-size: 36px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em">What changes when you’re an ambassador</h2>
      <p style="margin: 14px 0 0; font-family: 'Lora', Georgia, serif; font-size: 20px; line-height: 1.45; color: #004156; max-width: 760px">Every colleague keeps the Events at Wates portal. Ambassadors sign in to the same place and see the ambassador portal on top of it.</p>
      <div style="margin-top: 28px; display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 24px; align-items: stretch">

        <article aria-labelledby="cmp1" style="background: #FFFFFF; border-radius: 28px; padding: 28px; display: flex; flex-direction: column; gap: 20px">
          <div aria-hidden="true" style="border-radius: 18px; overflow: hidden; border: 1px solid #E6E1D6">
            <div style="background: #FFFFFF; padding: 12px 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #E6E1D6">
              <img src="assets/logo-midnight.png" alt="" style="height: 20px; width: auto">
              <span style="font-size: 12px; font-weight: 800">Events at Wates</span>
              <span style="margin-left: auto; width: 22px; height: 22px; border-radius: 50%; background: #2F2E3F"></span>
            </div>
            <div style="padding: 14px; background: #FFFFFF">
              <span style="display: block; width: 46%; height: 12px; border-radius: 4px; background: #2F2E3F"></span>
              <span style="display: block; width: 70%; height: 8px; margin-top: 8px; border-radius: 4px; background: #D9D4C7"></span>
              <div style="margin-top: 14px"><div aria-hidden="true" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px"><span style="display: block; min-height: 34px; padding: 4px; border-radius: 6px; background: #FAF8F3"></span><span style="display: block; min-height: 34px; padding: 4px; border-radius: 6px; background: #FAF8F3"></span><span style="display: block; min-height: 34px; padding: 4px; border-radius: 6px; background: #FAF8F3"><span style="display: block; height: 10px; margin-top: 6px; border-radius: 4px; background: #C1D1FF"></span></span><span style="display: block; min-height: 34px; padding: 4px; border-radius: 6px; background: #FAF8F3"></span><span style="display: block; min-height: 34px; padding: 4px; border-radius: 6px; background: #FAF8F3"></span><span style="display: block; min-height: 34px; padding: 4px; border-radius: 6px; background: #FAF8F3"></span><span style="display: block; min-height: 34px; padding: 4px; border-radius: 6px; background: #FAF8F3"></span><span style="display: block; min-height: 34px; padding: 4px; border-radius: 6px; background: #FAF8F3"></span><span style="display: block; min-height: 34px; padding: 4px; border-radius: 6px; background: #FAF8F3"><span style="display: block; height: 10px; margin-top: 6px; border-radius: 4px; background: #F9E569"></span></span><span style="display: block; min-height: 34px; padding: 4px; border-radius: 6px; background: #FAF8F3"></span><span style="display: block; min-height: 34px; padding: 4px; border-radius: 6px; background: #FAF8F3"><span style="display: block; height: 10px; margin-top: 6px; border-radius: 4px; background: #FFC66C"></span></span><span style="display: block; min-height: 34px; padding: 4px; border-radius: 6px; background: #FAF8F3"></span><span style="display: block; min-height: 34px; padding: 4px; border-radius: 6px; background: #FAF8F3"></span><span style="display: block; min-height: 34px; padding: 4px; border-radius: 6px; background: #FAF8F3"></span><span style="display: block; min-height: 34px; padding: 4px; border-radius: 6px; background: #FAF8F3"></span><span style="display: block; min-height: 34px; padding: 4px; border-radius: 6px; background: #FAF8F3"></span><span style="display: block; min-height: 34px; padding: 4px; border-radius: 6px; background: #FAF8F3"><span style="display: block; height: 10px; margin-top: 6px; border-radius: 4px; background: #CDE6A7"></span></span><span style="display: block; min-height: 34px; padding: 4px; border-radius: 6px; background: #FAF8F3"></span><span style="display: block; min-height: 34px; padding: 4px; border-radius: 6px; background: #FAF8F3"></span><span style="display: block; min-height: 34px; padding: 4px; border-radius: 6px; background: #FAF8F3"></span><span style="display: block; min-height: 34px; padding: 4px; border-radius: 6px; background: #FAF8F3"></span></div></div>
            </div>
          </div>
          <div>
            <p style="margin: 0; font-size: 13px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #004156">Every colleague</p>
            <h3 id="cmp1" style="margin: 6px 0 0; font-size: 26px; font-weight: 800">Colleague portal</h3>
          </div>
          <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; font-size: 16px; line-height: 1.5">
            <li style="display: flex; gap: 12px; align-items: flex-start"><span aria-hidden="true" style="flex: 0 0 auto; width: 24px; height: 24px; margin-top: 1px; border-radius: 50%; background: #E6E1D6; display: inline-flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#2F2E3F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span><span>Events open to all: socials, site tours and thought leadership</span></li>
            <li style="display: flex; gap: 12px; align-items: flex-start"><span aria-hidden="true" style="flex: 0 0 auto; width: 24px; height: 24px; margin-top: 1px; border-radius: 50%; background: #E6E1D6; display: inline-flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#2F2E3F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span><span>Book with a quick line manager approval</span></li>
            <li style="display: flex; gap: 12px; align-items: flex-start"><span aria-hidden="true" style="flex: 0 0 auto; width: 24px; height: 24px; margin-top: 1px; border-radius: 50%; background: #E6E1D6; display: inline-flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#2F2E3F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span><span>Register interest and suggest events</span></li>
            <li style="display: flex; gap: 12px; align-items: flex-start"><span aria-hidden="true" style="flex: 0 0 auto; width: 24px; height: 24px; margin-top: 1px; border-radius: 50%; background: #E6E1D6; display: inline-flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#2F2E3F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span><span>Feedback and bookings ready for your PDR</span></li>
          </ul>
        </article>

        <article aria-labelledby="cmp2" style="background: #2F2E3F; color: #FFFFFF; border-radius: 28px; padding: 28px; display: flex; flex-direction: column; gap: 20px; box-shadow: inset 0 0 0 2px #C9A54C">
          <div aria-hidden="true" style="border-radius: 18px; overflow: hidden; border: 1px solid #C9A54C">
            <div style="background: #2F2E3F; padding: 12px 14px; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid #C9A54C">
              <img src="assets/logo-white.png" alt="" style="height: 20px; width: auto">

<script type="text/plain" id="logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sent: false, lm: '' };
  }
  renderVals() {
    var self = this;
    var QS = [
      'Why do you want to be a Wates Ambassador?',
      'In your own words, what makes Wates different from other contractors?',
      'Tell us about a project, team or moment at Wates you’re proud of, and why.',
      'Describe a time you built a good relationship with someone, at work or outside it. What did you do, and what came of it?',
      'What do you think our clients value most when they choose a contractor?',
      'Which clients, sectors or partners do you know, or would like to get to know, and why?',
      'You’re at an event and a client complains to you about a Wates project. What do you do?',
      'After meeting someone useful at an event, what would you do in the following week?',
      'What would you bring to the ambassador group that others might not?'
    ];
    var questions = QS.map(function (t, i) { return { n: i + 1, text: t }; });
    var lmOptions = [['yes', 'Yes, and they support my application'], ['questions', 'Yes, but we still have questions to work through'], ['notyet', 'Not yet']].map(function (p) {
      return { label: p[1], pick: function () { self.setState({ lm: p[0] }); } };
    });
    return {
      questions: questions,
      lmOptions: lmOptions,
      notYet: this.state.lm === 'notyet',
      sent: this.state.sent,
      notSent: !this.state.sent,
      send: function (e) { if (e && e.preventDefault) e.preventDefault(); self.setState({ sent: true }); }
    };
  }
}
</script>
