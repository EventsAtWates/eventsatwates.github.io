<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin: ambassador applications – Events at Wates</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Lora:ital,wght@0,400;0,500;1,400;1,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF8F3;color:#2F2E3F;font-family:'Figtree',system-ui,sans-serif}
a{color:#004156}a:hover{color:#2F2E3F}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #008FA8;outline-offset:2px}
</style>

<style>body{margin:0}
.preview-tag{position:fixed;left:12px;bottom:12px;z-index:50;display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;background:#F9E569;color:#2F2E3F;font:700 13px Figtree,system-ui,sans-serif;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.preview-tag:hover{color:#2F2E3F;text-decoration:underline}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="font-family: 'Figtree', system-ui, sans-serif; color: #2F2E3F; background: #FAF8F3; min-height: 100vh">

  <header style="background: #2F2E3F; color: #FFFFFF">
    <div style="max-width: 1280px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; gap: 28px; flex-wrap: wrap">
      <a href="Organiser.html" style="display: flex; align-items: center; gap: 16px; text-decoration: none; color: #FFFFFF">
        <img src="assets/logo-white.png" alt="Wates Construction" style="height: 42px; width: auto">
        <span style="width: 1px; height: 32px; background: #6B6A80" aria-hidden="true"></span>
        <span style="font-weight: 800; font-size: 18px">Events at Wates</span>
        <span style="padding: 4px 10px; border-radius: 999px; background: #F9E569; color: #2F2E3F; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase">Admin</span>
      </a>
      <nav aria-label="Admin" style="display: flex; gap: 24px; flex-wrap: wrap; flex: 1 1 auto; font-size: 16px; font-weight: 600">
        <a href="Organiser.html" style="color: #FFFFFF; text-decoration: none">Overview</a>
        <a href="AdminEvents.html" style="color: #FFFFFF; text-decoration: none">Events</a>
        <a href="AdminApplications.html" aria-current="page" style="color: #FFFFFF; text-decoration: none; border-bottom: 3px solid #F9E569; padding-bottom: 4px">Ambassadors</a>
        <a href="AdminClients.html" style="color: #FFFFFF; text-decoration: none">Client targets</a>
        <a href="Dashboard.html" style="color: #FFFFFF; text-decoration: none">Colleague view</a>
      </nav>
      <a href="AdminEvents.html" style="display: inline-flex; align-items: center; min-height: 46px; padding: 0 20px; border-radius: 999px; background: #F9E569; color: #2F2E3F; font-weight: 800; font-size: 15px; text-decoration: none">+ Create event</a>
    </div>
  </header>

  <main style="max-width: 1280px; margin: 0 auto; padding: 48px 32px 80px; display: flex; flex-direction: column; gap: 44px">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap">
      <div>
        <p style="margin: 0 0 8px; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #004156">SLT review</p>
        <h1 style="margin: 0; font-size: 52px; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em">Ambassador applications</h1>
        <p style="margin: 12px 0 0; font-family: 'Lora', Georgia, serif; font-size: 22px; line-height: 1.45; color: #004156">Round 1: applications closed March 2026, with the cohort selected in April. Score the nine written answers 1 to 4 each, then select a cohort with a mix of levels.</p>
      </div>
      <p style="margin: 0; padding: 8px 14px; border-radius: 999px; background: #FFFFFF; border: 2px dashed #B9B3A4; font-size: 14px; font-weight: 700">Sample data for the storyboard</p>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px">
      <div style="background: #FFFFFF; border-radius: 24px; padding: 24px"><p style="margin: 0; font-size: 42px; font-weight: 800">24</p><p style="margin: 6px 0 0; font-size: 15px">Applications received</p></div>
      <div style="background: #FFFFFF; border-radius: 24px; padding: 24px"><p style="margin: 0; font-size: 42px; font-weight: 800">{{ approvedCount }} <span style="font-size: 20px; color: #4B4A5C">of 15–20</span></p><p style="margin: 6px 0 0; font-size: 15px">London cohort places filled</p></div>
      <div style="background: #FFFFFF; border-radius: 24px; padding: 24px"><p style="margin: 0; font-size: 42px; font-weight: 800">{{ waitingCount }}</p><p style="margin: 6px 0 0; font-size: 15px">Waiting for an SLT decision</p></div>
      <div style="background: #FFFFFF; border-radius: 24px; padding: 24px"><p style="margin: 0; font-size: 42px; font-weight: 800">3 <span style="font-size: 20px; color: #4B4A5C">of 8</span></p><p style="margin: 6px 0 0; font-size: 15px">Selected so far are below manager level</p></div>
    </div>

    <section aria-labelledby="queue">
      <h2 id="queue" style="margin: 0 0 16px; font-size: 28px; font-weight: 800">Waiting for review</h2>
      <div style="display: flex; flex-direction: column; gap: 14px">
        <template data-sc="for" list="{{ apps }}" as="a">
          <article style="background: #FFFFFF; border-radius: 24px; padding: 24px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
            <div style="flex: 1 1 240px; min-width: 0; display: flex; gap: 14px">
              <span aria-hidden="true" style="flex: 0 0 auto; width: 52px; height: 52px; border-radius: 50%; background: {{ a.colour }}; display: inline-flex; align-items: center; justify-content: center; font-weight: 800">{{ a.initials }}</span>
              <div style="min-width: 0">
                <p style="margin: 0; font-size: 19px; font-weight: 800">{{ a.name }}</p>
                <p style="margin: 2px 0 0; font-size: 15px; color: #4B4A5C">{{ a.role }}</p>
                <p style="margin: 8px 0 0; font-size: 14px; font-weight: 700; color: #004156">Line manager: {{ a.manager }}</p>
                <p style="margin: 6px 0 0; font-size: 14px; color: #4B4A5C">{{ a.level }}  ·  SLT score <strong style="color: #2F2E3F">{{ a.score }}</strong> of 36</p>
                <a href="#" style="display: inline-block; margin-top: 6px; font-size: 14px; font-weight: 700">Read all 10 answers</a>
              </div>
            </div>
            <div style="flex: 2 1 380px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; font-size: 15px; line-height: 1.55">
              <div><p style="margin: 0 0 4px; font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #004156">Why they applied</p><p style="margin: 0">{{ a.why }}</p></div>
              <div><p style="margin: 0 0 4px; font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #004156">Knows</p><p style="margin: 0">{{ a.knows }}</p></div>
            </div>
            <div style="flex: 0 1 220px; min-width: 200px; display: flex; flex-direction: column; gap: 10px">
              <template data-sc="if" value="{{ a.pending }}">
                <button type="button" onClick="{{ a.approve }}" style="display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 26px; border-radius: 999px; border: 0; background: #2F2E3F; color: #FFFFFF; font-family: inherit; font-weight: 800; font-size: 16px; cursor: pointer; text-decoration: none; min-height: 46px">Approve</button>
                <div style="display: flex; gap: 8px">
                  <button type="button" onClick="{{ a.hold }}" style="display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 22px; border-radius: 999px; border: 2px solid #2F2E3F; background: transparent; color: #2F2E3F; font-family: inherit; font-weight: 700; font-size: 15px; cursor: pointer; text-decoration: none; flex: 1 1 0; padding: 0 12px; min-height: 44px">Next round</button>
                  <button type="button" onClick="{{ a.decline }}" style="display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 22px; border-radius: 999px; border: 2px solid #2F2E3F; background: transparent; color: #2F2E3F; font-family: inherit; font-weight: 700; font-size: 15px; cursor: pointer; text-decoration: none; flex: 1 1 0; padding: 0 12px; min-height: 44px">Decline</button>
                </div>
              </template>
              <template data-sc="if" value="{{ a.decided }}">
                <p role="status" style="margin: 0; padding: 12px 16px; border-radius: 16px; font-size: 15px; font-weight: 800; background: {{ a.decisionBg }}">{{ a.decision }}</p>
                <button type="button" onClick="{{ a.reset }}" style="background: none; border: 0; padding: 0; min-height: 44px; font-family: inherit; font-size: 15px; font-weight: 700; color: #004156; text-decoration: underline; cursor: pointer; text-align: left">Undo</button>
              </template>
            </div>
          </article>
        </template>
      </div>
      <p style="margin: 16px 0 0; font-size: 15px; color: #4B4A5C">Approved colleagues get an email with the training dates. Declined colleagues keep access to every event open to all staff and are invited to apply again next round.</p>
    </section>

    <section aria-labelledby="train">
      <h2 id="train" style="margin: 0 0 16px; font-size: 28px; font-weight: 800">Selected ambassadors and training</h2>
      <div style="overflow-x: auto; background: #FFFFFF; border-radius: 24px">
        <table style="width: 100%; min-width: 820px; border-collapse: collapse; font-size: 16px">
          <thead>
            <tr style="text-align: left; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #4B4A5C">
              <th scope="col" style="padding: 18px 22px; font-weight: 700">Ambassador</th>
              <th scope="col" style="padding: 18px 12px; font-weight: 700">Team</th>
              <th scope="col" style="padding: 18px 12px; font-weight: 700">Training</th>
              <th scope="col" style="padding: 18px 12px; font-weight: 700">Special events</th>
              <th scope="col" style="padding: 18px 22px; font-weight: 700">Status</th>
            </tr>
          </thead>
          <tbody>
            <template data-sc="for" list="{{ ambassadors }}" as="m">
              <tr style="border-top: 1px solid #E6E1D6">
                <td style="padding: 16px 22px; font-weight: 700">{{ m.name }}</td>
                <td style="padding: 16px 12px">{{ m.team }}</td>
                <td style="padding: 16px 12px"><span style="display: block; width: 140px; height: 8px; border-radius: 999px; background: #E6E1D6; overflow: hidden"><span style="display: block; height: 8px; width: {{ m.fill }}; background: #008FA8"></span></span><span style="display: block; margin-top: 6px; font-size: 14px; color: #4B4A5C">{{ m.modules }}</span></td>
                <td style="padding: 16px 12px">{{ m.events }}</td>
                <td style="padding: 16px 22px"><span style="{{ m.pill }}">{{ m.status }}</span></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>
</template>
<script type="text/plain" id="logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { d: {} };
  }
  renderVals() {
    var self = this;
    var APPS = [
      { id: 'a1', initials: 'AP', colour: '#C1D1FF', name: '[Applicant name]', role: 'Senior Project Manager, London Residential', manager: 'discussed, supports', level: 'Manager', score: 31, why: 'Wants to build on relationships from two recent build-to-rent schemes and help win the next phase.', knows: 'Housing associations, build-to-rent, two cost consultancies' },
      { id: 'a2', initials: 'AP', colour: '#F9E569', name: '[Applicant name]', role: 'Design Manager, London', manager: 'discussed, supports', level: 'Manager', score: 27, why: 'Works closely with architects day to day and wants to represent Wates earlier in the design process.', knows: 'Architecture practices, planning consultants' },
      { id: 'a3', initials: 'AP', colour: '#CDE6A7', name: '[Applicant name]', role: 'Commercial Manager, London', manager: 'discussed, still working through questions', level: 'Senior manager', score: 24, why: 'Keen to build relationships with client-side cost consultants beyond live bids.', knows: 'Cost consultants, public sector frameworks' },
      { id: 'a4', initials: 'AP', colour: '#F7C8B3', name: '[Applicant name]', role: 'Assistant Project Manager, London', manager: 'discussed, supports', level: 'Assistant or coordinator', score: 33, why: 'Early in their career and wants to learn to network well with clients and project managers.', knows: 'Project management firms, education clients' }
    ];
    var d = this.state.d;
    var set = function (id, v) { var n = Object.assign({}, self.state.d); n[id] = v; self.setState({ d: n }); };
    var LABEL = { approved: 'Approved as an ambassador', hold: 'Moved to next round', declined: 'Declined, thanked by email' };
    var BG = { approved: '#CDE6A7', hold: '#C1D1FF', declined: '#F7C8B3' };
    var approvedNow = 0, waiting = 0;
    var apps = APPS.map(function (a) {
      var s = d[a.id];
      if (s === 'approved') approvedNow++;
      if (!s) waiting++;
      return Object.assign({}, a, {
        pending: !s, decided: !!s,
        decision: s ? LABEL[s] : '', decisionBg: s ? BG[s] : '#FFFFFF',
        approve: function () { set(a.id, 'approved'); },
        hold: function () { set(a.id, 'hold'); },
        decline: function () { set(a.id, 'declined'); },
        reset: function () { set(a.id, null); }
      });
    });
    var pill = function (bg) { return 'display: inline-block; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 800; background: ' + bg + '; color: #2F2E3F;'; };
    var ambassadors = [
      { name: 'Rico Cacciatore', team: 'London Development Board', fill: '67%', modules: '2 of 3 modules', events: '1 accepted', status: 'Training', pill: pill('#F9E569') },
      { name: '[Name]', team: 'London Residential', fill: '100%', modules: '3 of 3 modules', events: '2 accepted', status: 'Ready', pill: pill('#CDE6A7') },
      { name: '[Name]', team: 'Commercial', fill: '100%', modules: '3 of 3 modules', events: '1 accepted', status: 'Ready', pill: pill('#CDE6A7') },
      { name: '[Name]', team: 'Pre-construction', fill: '33%', modules: '1 of 3 modules', events: 'None yet', status: 'Training', pill: pill('#F9E569') },
      { name: '[Name]', team: 'Operations', fill: '0%', modules: 'Starts May 2026', events: 'None yet', status: 'Booked on training', pill: pill('#C1D1FF') }
    ];
    return {
      apps: apps, ambassadors: ambassadors,
      approvedCount: 8 + approvedNow,
      waitingCount: waiting
    };
  }
}
</script>
<a class="preview-tag" href="screens.html">Concept preview · sample content · all screens</a>
<script src="dc.js"></script>
</body>
</html>
