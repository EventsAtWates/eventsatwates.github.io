<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Event check-in – Events at Wates</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Lora:ital,wght@0,400;0,500;1,400;1,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#F9E569}
button:focus-visible,a:focus-visible{outline:3px solid #F9E569;outline-offset:2px}
</style>

<style>body{margin:0}html{background:#E9E6DF}body{display:flex;justify-content:center}
.preview-tag{position:fixed;left:12px;bottom:12px;z-index:50;padding:8px 14px;border-radius:999px;background:#F9E569;color:#2F2E3F;font:700 13px Figtree,system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.2);pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Lora:ital,wght@0,400;0,500;1,400;1,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#F9E569}
button:focus-visible,a:focus-visible{outline:3px solid #F9E569;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #2F2E3F; color: #FFFFFF; font-family: 'Figtree', system-ui, sans-serif; padding: 28px 22px; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <img src="assets/logo-white.png" alt="Wates Construction" style="height: 32px; width: auto">
    <span style="font-size: 14px; font-weight: 800">Events at Wates</span>
  </div>

  <div>
    <p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #C1D1FF">Your ticket</p>
    <h1 style="margin: 6px 0 0; font-size: 30px; line-height: 1.05; font-weight: 800">Today, 08:00</h1>
  </div>

  <div style="background: #FAF8F3; color: #2F2E3F; border-radius: 26px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
    <p style="margin: 0; align-self: flex-start; padding: 6px 12px; border-radius: 999px; background: #C1D1FF; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase">Thought leadership</p>
    <p style="margin: 0; font-size: 21px; line-height: 1.2; font-weight: 800">Building in the age of AI: breakfast roundtable</p>
    <p style="margin: 0; font-size: 15px">Thu 12 Nov  ·  08:00–10:00<br>The Foundry Rooms, Southwark, London</p>
    <div style="display: flex; justify-content: center; padding: 6px 0">
      <svg width="170" height="170" viewBox="0 0 29 29" role="img" aria-label="Ticket code for Rico Cacciatore" shape-rendering="crispEdges">
        <rect width="29" height="29" fill="#FFFFFF"></rect>
        <g fill="#2F2E3F">
          <rect x="2" y="2" width="7" height="7"></rect><rect x="3" y="3" width="5" height="5" fill="#FFFFFF"></rect><rect x="4" y="4" width="3" height="3"></rect>
          <rect x="20" y="2" width="7" height="7"></rect><rect x="21" y="3" width="5" height="5" fill="#FFFFFF"></rect><rect x="22" y="4" width="3" height="3"></rect>
          <rect x="2" y="20" width="7" height="7"></rect><rect x="3" y="21" width="5" height="5" fill="#FFFFFF"></rect><rect x="4" y="22" width="3" height="3"></rect>
          <rect x="11" y="2" width="2" height="1"></rect><rect x="14" y="3" width="1" height="2"></rect><rect x="16" y="2" width="2" height="2"></rect><rect x="11" y="6" width="3" height="1"></rect><rect x="16" y="6" width="1" height="3"></rect>
          <rect x="2" y="11" width="2" height="1"></rect><rect x="5" y="12" width="3" height="1"></rect><rect x="2" y="14" width="1" height="3"></rect><rect x="6" y="15" width="2" height="2"></rect>
          <rect x="10" y="10" width="3" height="3"></rect><rect x="14" y="11" width="2" height="1"></rect><rect x="17" y="10" width="2" height="3"></rect><rect x="21" y="11" width="3" height="1"></rect><rect x="25" y="12" width="2" height="2"></rect>
          <rect x="11" y="14" width="1" height="3"></rect><rect x="13" y="15" width="3" height="1"></rect><rect x="18" y="15" width="1" height="2"></rect><rect x="20" y="14" width="2" height="1"></rect><rect x="23" y="16" width="3" height="1"></rect>
          <rect x="10" y="18" width="2" height="2"></rect><rect x="14" y="18" width="1" height="3"></rect><rect x="16" y="19" width="3" height="1"></rect><rect x="21" y="18" width="1" height="3"></rect><rect x="24" y="19" width="2" height="1"></rect>
          <rect x="11" y="22" width="3" height="1"></rect><rect x="16" y="22" width="1" height="2"></rect><rect x="18" y="23" width="3" height="2"></rect><rect x="23" y="22" width="1" height="3"></rect><rect x="25" y="24" width="2" height="2"></rect>
          <rect x="10" y="25" width="1" height="2"></rect><rect x="12" y="25" width="2" height="1"></rect><rect x="15" y="26" width="2" height="1"></rect><rect x="20" y="26" width="2" height="1"></rect>
        </g>
      </svg>
    </div>
    <p style="margin: 0; text-align: center; font-size: 14px; font-weight: 600">Rico Cacciatore  ·  2 credits booked</p>
  </div>

  <template data-sc="if" value="{{ notIn }}">
    <button type="button" onClick="{{ checkIn }}" style="min-height: 58px; border-radius: 999px; border: 0; background: #F9E569; color: #2F2E3F; font-family: inherit; font-weight: 800; font-size: 18px; cursor: pointer">I’m here: check me in</button>
    <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #E4E2EC; text-align: center">Or show this code at the door. Checking in logs your 2 hours of dedicated networking time.</p>
  </template>
  <template data-sc="if" value="{{ isIn }}">
    <div role="status" style="background: #CDE6A7; color: #2F2E3F; border-radius: 22px; padding: 18px; text-align: center">
      <p style="margin: 0; font-size: 20px; font-weight: 800">You’re checked in</p>
      <p style="margin: 6px 0 0; font-size: 15px">08:04  ·  2 hours of dedicated time logged. Enjoy it.</p>
    </div>
    <a href="Event.html" style="text-align: center; font-size: 15px; font-weight: 700">See who’s expected today</a>
  </template>

  <a href="Event.html" style="margin-top: auto; text-align: center; font-size: 14px; font-weight: 600">Running late or can’t make it? Tell the organiser</a>
</div>
</template>
<script type="text/plain" id="logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { checkedIn: false };
  }
  renderVals() {
    var self = this;
    return {
      isIn: this.state.checkedIn,
      notIn: !this.state.checkedIn,
      checkIn: function () { self.setState({ checkedIn: true }); }
    };
  }
}
</script>
<div class="preview-tag" aria-hidden="true">Concept preview · sample content</div>
<script src="dc.js"></script>
</body>
</html>
