<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Organiser view – Events at Wates</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Lora:ital,wght@0,400;0,500;1,400;1,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF8F3;color:#2F2E3F;font-family:'Figtree',system-ui,sans-serif}
a{color:#004156}a:hover{color:#2F2E3F}
a:focus-visible{outline:3px solid #008FA8;outline-offset:2px}
</style>

<style>body{margin:0}
.preview-tag{position:fixed;left:12px;bottom:12px;z-index:50;padding:8px 14px;border-radius:999px;background:#F9E569;color:#2F2E3F;font:700 13px Figtree,system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.2);pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Lora:ital,wght@0,400;0,500;1,400;1,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF8F3;color:#2F2E3F;font-family:'Figtree',system-ui,sans-serif}
a{color:#004156}a:hover{color:#2F2E3F}
a:focus-visible{outline:3px solid #008FA8;outline-offset:2px}
</style>
</helmet>
<div style="font-family: 'Figtree', system-ui, sans-serif; color: #2F2E3F; background: #FAF8F3; min-height: 100vh">

  <header style="background: #2F2E3F; color: #FFFFFF">
    <div style="max-width: 1280px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; gap: 28px; flex-wrap: wrap">
      <a href="index.html" style="display: flex; align-items: center; gap: 16px; text-decoration: none; color: #FFFFFF">
        <img src="assets/logo-white.png" alt="Wates Construction" style="height: 42px; width: auto">
        <span style="width: 1px; height: 32px; background: #6B6A80" aria-hidden="true"></span>
        <span style="font-weight: 800; font-size: 18px">Events at Wates</span>
        <span style="padding: 4px 10px; border-radius: 999px; background: #F9E569; color: #2F2E3F; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase">Organiser</span>
      </a>
      <nav aria-label="Organiser" style="display: flex; gap: 24px; flex-wrap: wrap; flex: 1 1 auto; font-size: 16px; font-weight: 600">
        <a href="Organiser.html" aria-current="page" style="color: #FFFFFF; text-decoration: none; border-bottom: 3px solid #F9E569; padding-bottom: 4px">Overview</a>
        <a href="Interest.html" style="color: #FFFFFF; text-decoration: none">Ideas and interest</a>
        <a href="Feedback.html" style="color: #FFFFFF; text-decoration: none">Feedback and write-ups</a>
        <a href="Dashboard.html" style="color: #FFFFFF; text-decoration: none">Colleague view</a>
      </nav>
      <a href="#" style="display: inline-flex; align-items: center; min-height: 46px; padding: 0 20px; border-radius: 999px; background: #F9E569; color: #2F2E3F; font-weight: 800; font-size: 15px; text-decoration: none">+ Create event</a>
    </div>
  </header>

  <main style="max-width: 1280px; margin: 0 auto; padding: 48px 32px 80px">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap">
      <div>
        <p style="margin: 0 0 8px; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #004156">Wates Next Gen</p>
        <h1 style="margin: 0; font-size: 48px; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em">How this year is going</h1>
      </div>
      <p style="margin: 0; padding: 8px 14px; border-radius: 999px; background: #FFFFFF; border: 2px dashed #B9B3A4; font-size: 14px; font-weight: 700">Sample data for the storyboard</p>
    </div>

    <div style="margin-top: 28px; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px">
      <div style="background: #FFFFFF; border-radius: 24px; padding: 24px"><p style="margin: 0; font-size: 42px; font-weight: 800">3</p><p style="margin: 6px 0 0; font-size: 15px">Events run so far this year</p></div>
      <div style="background: #FFFFFF; border-radius: 24px; padding: 24px"><p style="margin: 0; font-size: 42px; font-weight: 800">1.2 : 1</p><p style="margin: 6px 0 0; font-size: 15px">External guests per Wates attendee (target 1 : 1)</p></div>
      <div style="background: #FFFFFF; border-radius: 24px; padding: 24px"><p style="margin: 0; font-size: 42px; font-weight: 800">4%</p><p style="margin: 6px 0 0; font-size: 15px">No-shows: hours released and places re-offered</p></div>
      <div style="background: #FFFFFF; border-radius: 24px; padding: 24px"><p style="margin: 0; font-size: 42px; font-weight: 800">2 <span style="font-size: 20px; color: #4B4A5C">of 3</span></p><p style="margin: 6px 0 0; font-size: 15px">Event write-ups shared with the business</p></div>
    </div>

    <section aria-labelledby="mix" style="margin-top: 24px; background: #FFFFFF; border-radius: 24px; padding: 26px">
      <h2 id="mix" style="margin: 0 0 14px; font-size: 20px; font-weight: 800">Who’s coming: Wates attendees by level</h2>
      <div role="img" aria-label="Attendees by level: directors 8%, senior managers 22%, managers 32%, other roles 38%" style="display: flex; height: 44px; border-radius: 12px; overflow: hidden; font-size: 14px; font-weight: 800">
        <span style="width: 8%; background: #2F2E3F; color: #FFFFFF; display: flex; align-items: center; justify-content: center">8%</span>
        <span style="width: 22%; background: #004156; color: #FFFFFF; display: flex; align-items: center; justify-content: center">22%</span>
        <span style="width: 32%; background: #C1D1FF; display: flex; align-items: center; justify-content: center">32%</span>
        <span style="width: 38%; background: #F9E569; display: flex; align-items: center; justify-content: center">38%</span>
      </div>
      <div style="margin-top: 12px; display: flex; flex-wrap: wrap; gap: 18px; font-size: 15px">
        <span><span aria-hidden="true" style="display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: #2F2E3F; margin-right: 6px"></span>Directors</span>
        <span><span aria-hidden="true" style="display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: #004156; margin-right: 6px"></span>Senior managers</span>
        <span><span aria-hidden="true" style="display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: #C1D1FF; margin-right: 6px"></span>Managers</span>
        <span><span aria-hidden="true" style="display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: #F9E569; margin-right: 6px"></span>Other roles</span>
      </div>
    </section>

    <section aria-labelledby="up" style="margin-top: 36px">
      <h2 id="up" style="margin: 0 0 14px; font-size: 28px; font-weight: 800">Upcoming events</h2>
      <div style="overflow-x: auto; background: #FFFFFF; border-radius: 24px">
        <table style="width: 100%; min-width: 980px; border-collapse: collapse; font-size: 16px">
          <thead>
            <tr style="text-align: left; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #4B4A5C">
              <th scope="col" style="padding: 18px 22px; font-weight: 700">Event</th>
              <th scope="col" style="padding: 18px 12px; font-weight: 700">Wates booked</th>
              <th scope="col" style="padding: 18px 12px; font-weight: 700">External guests</th>
              <th scope="col" style="padding: 18px 12px; font-weight: 700">Awaiting approval</th>
              <th scope="col" style="padding: 18px 22px; font-weight: 700">Next action</th>
            </tr>
          </thead>
          <tbody>
            <template data-sc="for" list="{{ rows }}" as="r">
              <tr style="border-top: 1px solid #E6E1D6">
                <td style="padding: 18px 22px"><span style="display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 1px solid #2F2E3F; margin-right: 10px; background: {{ r.colour }}" aria-hidden="true"></span><strong>{{ r.title }}</strong><span style="display: block; margin-left: 22px; font-size: 14px; color: #4B4A5C">{{ r.date }}</span></td>
                <td style="padding: 18px 12px"><strong>{{ r.booked }}</strong><span style="display: block; margin-top: 6px; width: 120px; height: 8px; border-radius: 999px; background: #E6E1D6; overflow: hidden"><span style="display: block; height: 8px; width: {{ r.fill }}; background: #2F2E3F"></span></span></td>
                <td style="padding: 18px 12px"><strong>{{ r.guests }}</strong><span style="display: block; font-size: 14px; color: #4B4A5C">{{ r.ratio }}</span></td>
                <td style="padding: 18px 12px">{{ r.pending }}</td>
                <td style="padding: 18px 22px"><a href="{{ r.href }}" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid #2F2E3F; color: #2F2E3F; font-weight: 700; font-size: 14px; text-decoration: none">{{ r.action }}</a></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>
</template>
<script type="text/plain" id="logic">
class Component extends DCLogic {
  renderVals() {
    return {
      rows: [
        { title: 'Building in the age of AI: breakfast roundtable', date: 'Thu 12 Nov · 08:00', colour: '#C1D1FF', booked: '8 of 10', fill: '80%', guests: '11', ratio: '1.4 per Wates attendee', pending: '1', action: 'Send briefing', href: 'Event.html' },
        { title: 'Site tour of 56 Bishops Avenue and talks from selected product manufacturers such as IGMS', date: 'Wed 18 Nov · 14:00', colour: '#F9E569', booked: '6 of 8', fill: '75%', guests: '5', ratio: '0.8 per Wates attendee', pending: '2', action: 'Invite more guests', href: '#' },
        { title: 'London Construction Leaders Summit', date: 'Fri 20 Nov · 09:00', colour: '#FFC66C', booked: '6 of 10', fill: '60%', guests: 'n/a', ratio: 'External conference', pending: '3', action: 'Chase approvals', href: '#' },
        { title: 'Five-a-side with clients and consultants', date: 'Thu 26 Nov · 18:00', colour: '#CDE6A7', booked: '8 of 20', fill: '40%', guests: '9', ratio: '1.1 per Wates attendee', pending: '0', action: 'Promote event', href: '#' },
        { title: 'Winter drinks with our consultant partners', date: 'Tue 1 Dec · 18:00', colour: '#F7C8B3', booked: '10 of 30', fill: '33%', guests: '14', ratio: '1.4 per Wates attendee', pending: '4', action: 'Open check-in on the day', href: 'CheckIn.html' }
      ]
    };
  }
}
</script>
<div class="preview-tag" aria-hidden="true">Concept preview · sample content</div>
<script src="dc.js"></script>
</body>
</html>
