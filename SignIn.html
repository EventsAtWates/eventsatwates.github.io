<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in to Events at Wates</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Lora:ital,wght@0,400;0,500;1,400;1,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF8F3;color:#2F2E3F;font-family:'Figtree',system-ui,sans-serif}
a{color:#004156}a:hover{color:#2F2E3F}
input:focus-visible,a:focus-visible{outline:3px solid #008FA8;outline-offset:2px}
</style>

<style>body{margin:0}
.preview-tag{position:fixed;left:12px;bottom:12px;z-index:50;padding:8px 14px;border-radius:999px;background:#F9E569;color:#2F2E3F;font:700 13px Figtree,system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.2);pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Lora:ital,wght@0,400;0,500;1,400;1,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF8F3;color:#2F2E3F;font-family:'Figtree',system-ui,sans-serif}
a{color:#004156}a:hover{color:#2F2E3F}
input:focus-visible,a:focus-visible{outline:3px solid #008FA8;outline-offset:2px}
</style>
</helmet>
<div style="font-family: 'Figtree', system-ui, sans-serif; color: #2F2E3F; background: #FAF8F3; min-height: 900px; display: flex; flex-wrap: wrap">

  <div style="flex: 1 1 520px; min-width: 0; background: #2F2E3F; color: #FFFFFF; padding: 48px 56px; display: flex; flex-direction: column; justify-content: space-between; gap: 40px; position: relative; overflow: hidden">
    <a href="index.html" style="display: flex; align-items: center; gap: 16px; color: #FFFFFF; text-decoration: none">
      <img src="assets/logo-white.png" alt="Wates Construction" style="height: 44px; width: auto">
      <span style="width: 1px; height: 32px; background: #6B6A80" aria-hidden="true"></span>
      <span style="font-weight: 800; font-size: 18px">Events at Wates</span>
    </a>
    <div>
      <img src="assets/building.png" alt="" style="width: 100%; max-width: 440px; height: auto; display: block">
      <h1 style="margin: 32px 0 0; font-size: 56px; line-height: 1; font-weight: 800; letter-spacing: -0.02em">Your next <span style="font-family: 'Lora', Georgia, serif; font-style: italic; font-weight: 400; color: #F9E569">great</span> connection starts here.</h1>
    </div>
    <p style="margin: 0; font-family: 'Lora', Georgia, serif; font-size: 18px; color: #C1D1FF">Reimagining places for people to thrive</p>
  </div>

  <main style="flex: 1 1 520px; min-width: 0; display: flex; align-items: center; justify-content: center; padding: 56px 32px">
    <form style="width: 100%; max-width: 440px; background: #FFFFFF; border-radius: 28px; padding: 44px 40px; display: flex; flex-direction: column; gap: 20px">
      <div>
        <p style="margin: 0 0 8px; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #004156">Welcome back</p>
        <h2 style="margin: 0; font-size: 36px; line-height: 1.1; font-weight: 800">Sign in to sign up</h2>
        <p style="margin: 10px 0 0; font-size: 16px; line-height: 1.5; color: #4B4A5C">Use your Wates email address to book events and see your credits.</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="email" style="font-size: 15px; font-weight: 700">Wates email address</label>
        <input id="email" type="email" autocomplete="username" value="rico.cacciatore@wates.co.uk" style="min-height: 52px; padding: 0 16px; border-radius: 14px; border: 2px solid #D9D4C7; background: #FAF8F3; font-family: inherit; font-size: 16px; color: #2F2E3F">
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between; align-items: baseline">
          <label for="password" style="font-size: 15px; font-weight: 700">Password</label>
          <a href="#" style="font-size: 14px; font-weight: 600">Forgotten your password?</a>
        </div>
        <input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" style="min-height: 52px; padding: 0 16px; border-radius: 14px; border: 2px solid #D9D4C7; background: #FAF8F3; font-family: inherit; font-size: 16px; color: #2F2E3F">
      </div>
      <a href="Dashboard.html" style="display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 999px; background: #2F2E3F; color: #FFFFFF; font-weight: 800; font-size: 17px; text-decoration: none; margin-top: 4px">Sign in</a>
      <a href="index.html" style="text-align: center; font-size: 15px; font-weight: 600">Back to all events</a>
    </form>
  </main>
</div>
</template>
<script type="text/plain" id="logic">
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
<div class="preview-tag" aria-hidden="true">Concept preview · sample content</div>
<script src="dc.js"></script>
</body>
</html>
