<style>
body{margin:0;background:#FAF8F3;color:#2F2E3F;font-family:'Figtree',system-ui,sans-serif}

button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #008FA8;outline-offset:2px}

.preview-tag{position:fixed;left:12px;bottom:12px;z-index:50;display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;background:#F9E569;color:#2F2E3F;font:700 13px Figtree,system-ui,sans-serif;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.2)}

<body>
<div id="app"></div>
<template id="tpl">
<div style="font-family: 'Figtree', system-ui, sans-serif; color: #2F2E3F; background: #FAF8F3; min-height: 100vh">

  <header style="background: #2F2E3F; color: #FFFFFF; border-bottom: 3px solid #C9A54C">
    <div style="max-width: 1280px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; gap: 28px; flex-wrap: wrap">
      <a href="index.html" style="display: flex; align-items: center; gap: 16px; text-decoration: none; color: #FFFFFF">
        <img src="assets/logo-white.png" alt="Wates Construction" style="height: 42px; width: auto">
        <span style="width: 1px; height: 32px; background: #6B6A80" aria-hidden="true"></span>
        <span style="display: flex; align-items: center; gap: 10px"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 120 120" style="flex: 0 0 auto; display: block"><defs><linearGradient id="hdrpinr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3E3AE"></stop><stop offset="0.45" stop-color="#C9A54C"></stop><stop offset="0.7" stop-color="#E6CD86"></stop><stop offset="1" stop-color="#9C7A2B"></stop></linearGradient><linearGradient id="hdrpins" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9C7A2B"></stop><stop offset="1" stop-color="#F3E3AE"></stop></linearGradient></defs><circle cx="60" cy="60" r="57" fill="url(#hdrpinr)"></circle><circle cx="60" cy="60" r="47" fill="#2F2E3F"></circle><circle cx="60" cy="60" r="41" fill="none" stroke="#C9A54C" stroke-width="1" stroke-opacity="0.7"></circle><g transform="translate(27 50) scale(0.48)"><path d="M4 18 C40 4 100 0 146 6 C108 10 80 20 60 36 C52 28 42 24 30 28 C20 28 10 24 4 18Z" fill="#E6CD86" opacity=".55"></path><path d="M4 18 C10 24 20 28 30 28 C42 24 52 28 60 36 C70 22 90 12 118 7 C80 6 40 8 4 18Z" fill="url(#hdrpins)"></path><path d="M4 18 C40 4 100 0 146 6 C110 5 70 6 36 16 C24 18 14 18 4 18Z" fill="#F3E3AE"></path></g><path d="M30 78 Q60 90 90 78" fill="none" stroke="#C9A54C" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8"></path><ellipse cx="44" cy="28" rx="16" ry="5" fill="#FFFFFF" opacity="0.18" transform="rotate(-28 44 28)"></ellipse></svg><span style="display: flex; flex-direction: column; line-height: 1.1"><span style="font-weight: 800; font-size: 18px">Events at Wates</span><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #E6CD86">Ambassador portal</span></span></span>
      </a>
      <nav aria-label="Main" style="display: flex; gap: 24px; flex-wrap: wrap; flex: 1 1 auto; font-size: 16px; font-weight: 600">
        <a href="AmbassadorHome.html" aria-current="page" style="color: #FFFFFF; text-decoration: none; border-bottom: 3px solid #C9A54C; padding-bottom: 4px">My events</a>
        <a href="AmbassadorHome.html#cal" style="color: #FFFFFF; text-decoration: none">My calendar</a>
        <a href="AmbassadorEvent.html" style="color: #FFFFFF; text-decoration: none">Briefings</a>
        <a href="AmbassadorHome.html#training" style="color: #FFFFFF; text-decoration: none">Training</a>
      </nav>
      <a href="AmbassadorHome.html" aria-label="Your account: Rico Cacciatore, Wates Ambassador" style="width: 44px; height: 44px; border-radius: 50%; background: #2F2E3F; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; text-decoration: none; box-shadow: 0 0 0 2px #C9A54C">RC</a>
    </div>
  </header>

  <section style="background: #2F2E3F; color: #FFFFFF; position: relative; overflow: hidden; border-bottom: 3px solid #C9A54C">
    <svg aria-hidden="true" viewBox="0 0 1440 360" preserveAspectRatio="xMaxYMid slice" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none">
      <path d="M700 300 C 820 240, 900 340, 1010 280 C 1090 236, 1070 180, 1020 196 C 970 212, 1030 290, 1140 250 S 1180 190, 1268 128" fill="none" stroke="#C9A54C" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8"></path><g transform="translate(1262 112) rotate(-16) scale(0.9)"><path d="M4 18 C40 4 100 0 146 6 C108 10 80 20 60 36 C52 28 42 24 30 28 C20 28 10 24 4 18Z" fill="#F3E3AE" opacity=".75"></path><path d="M4 18 C10 24 20 28 30 28 C42 24 52 28 60 36 C70 22 90 12 118 7 C80 6 40 8 4 18Z" fill="#C9A54C"></path><path d="M4 18 C40 4 100 0 146 6 C110 5 70 6 36 16 C24 18 14 18 4 18Z" fill="#E6CD86"></path></g>
    </svg>
    <div style="position: relative; max-width: 1280px; margin: 0 auto; padding: 40px 32px 56px">
      <nav aria-label="Breadcrumb" style="font-size: 15px; font-weight: 600"><a href="AmbassadorHome.html" style="color: #E6CD86">My events</a>  /  <span>Ambassador events</span></nav>
      <div style="margin-top: 28px; display: flex; gap: 10px; flex-wrap: wrap">
        <span style="display: inline-block; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 800; letter-spacing: 0.04em; background: #C9A54C; color: #2F2E3F">AMBASSADOR EVENT</span>
        <span style="display: inline-block; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 800; letter-spacing: 0.04em; background: #F7C8B3; color: #2F2E3F">DRINKS AND DINNER</span>
        <span style="display: inline-block; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 800; letter-spacing: 0.04em; border: 1px solid #C9A54C; color: #E6CD86">INVITATION ONLY</span>
      </div>
      <div style="display: flex; gap: 28px; align-items: center; flex-wrap: wrap; margin-top: 18px">
        <h1 style="margin: 0; flex: 1 1 520px; font-size: clamp(40px, 5vw, 64px); line-height: 1.02; font-weight: 800; letter-spacing: -0.02em; max-width: 860px">Riverstone Living partners’ breakfast</h1>
        <svg aria-hidden="true" width="110" height="110" viewBox="0 0 120 120" style="flex: 0 0 auto; display: block"><defs><linearGradient id="evpinr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3E3AE"></stop><stop offset="0.45" stop-color="#C9A54C"></stop><stop offset="0.7" stop-color="#E6CD86"></stop><stop offset="1" stop-color="#9C7A2B"></stop></linearGradient><linearGradient id="evpins" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9C7A2B"></stop><stop offset="1" stop-color="#F3E3AE"></stop></linearGradient></defs><circle cx="60" cy="60" r="57" fill="url(#evpinr)"></circle><circle cx="60" cy="60" r="47" fill="#2F2E3F"></circle><circle cx="60" cy="60" r="41" fill="none" stroke="#C9A54C" stroke-width="1" stroke-opacity="0.7"></circle><g transform="translate(27 50) scale(0.48)"><path d="M4 18 C40 4 100 0 146 6 C108 10 80 20 60 36 C52 28 42 24 30 28 C20 28 10 24 4 18Z" fill="#E6CD86" opacity=".55"></path><path d="M4 18 C10 24 20 28 30 28 C42 24 52 28 60 36 C70 22 90 12 118 7 C80 6 40 8 4 18Z" fill="url(#evpins)"></path><path d="M4 18 C40 4 100 0 146 6 C110 5 70 6 36 16 C24 18 14 18 4 18Z" fill="#F3E3AE"></path></g><path d="M30 78 Q60 90 90 78" fill="none" stroke="#C9A54C" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8"></path><ellipse cx="44" cy="28" rx="16" ry="5" fill="#FFFFFF" opacity="0.18" transform="rotate(-28 44 28)"></ellipse></svg>
      </div>
      <p style="margin: 18px 0 0; font-family: 'Lora', Georgia, serif; font-size: 22px; line-height: 1.45; max-width: 760px; color: #E4E2EC">A small breakfast with Riverstone Living’s development team and their consultants, hosted by Wates.</p>
      <div style="margin-top: 24px; display: flex; flex-wrap: wrap; gap: 24px; font-size: 17px; font-weight: 600">
        <span>Tuesday 24 November 2026</span><span>08:00–10:00</span><span>The Mercer Room, Clerkenwell, London</span>
      </div>
    </div>
  </section>

  <main style="max-width: 1280px; margin: 0 auto; padding: 48px 32px 80px; display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start">
    <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 44px">

      <section aria-labelledby="obj" style="background: #FFFFFF; border-radius: 28px; padding: 32px">
        <p style="margin: 0 0 8px; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #004156">Your briefing</p>
        <h2 id="obj" style="margin: 0; font-size: 30px; font-weight: 800">Why we’re going</h2>
        <p style="margin: 14px 0 0; font-size: 18px; line-height: 1.65">Strengthen our relationship with Riverstone Living’s development team ahead of their [2027 framework]. Listen for their priorities, and leave each target with a reason to talk again.</p>
        <p style="margin: 14px 0 0; font-size: 15px; color: #4B4A5C">Briefing prepared by [Admin name], Wates Next Gen, with the client’s relationship owner.</p>
      </section>

      <section aria-labelledby="targets">
        <h2 id="targets" style="margin: 0; font-size: 30px; font-weight: 800">Who to meet</h2>
        <p style="margin: 10px 0 20px; font-size: 16px; line-height: 1.55; color: #4B4A5C">Your targets for this event, from the client targets list. Agree with the other ambassadors who will introduce themselves to whom.</p>
        <div style="display: flex; flex-direction: column; gap: 14px">
          <template data-sc="for" list="{{ targets }}" as="t">
            <article style="background: #FFFFFF; border-radius: 24px; padding: 24px; display: flex; flex-wrap: wrap; gap: 20px; border-left: 0; box-shadow: inset 0 6px 0 {{ t.bar }}">
              <div style="flex: 1 1 260px; min-width: 0; display: flex; gap: 14px; align-items: flex-start">
                <span aria-hidden="true" style="flex: 0 0 auto; width: 52px; height: 52px; border-radius: 50%; background: {{ t.colour }}; display: inline-flex; align-items: center; justify-content: center; font-weight: 800">{{ t.initials }}</span>
                <div style="min-width: 0">
                  <p style="margin: 0; font-size: 19px; font-weight: 800">{{ t.name }}</p>
                  <p style="margin: 2px 0 0; font-size: 15px; color: #4B4A5C">{{ t.role }}</p>
                  <p style="margin: 8px 0 0"><span style="display: inline-block; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 800; letter-spacing: 0.04em; background: {{ t.prioBg }}; color: #2F2E3F">{{ t.priority }}</span></p>
                </div>
              </div>
              <div style="flex: 2 1 380px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; font-size: 15px; line-height: 1.55">
                <div><p style="margin: 0 0 4px; font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #004156">Why they matter</p><p style="margin: 0">{{ t.why }}</p></div>
                <div><p style="margin: 0 0 4px; font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #004156">Talk about</p><p style="margin: 0">{{ t.talk }}</p></div>
                <div><p style="margin: 0 0 4px; font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #004156">Relationship owner</p><p style="margin: 0">{{ t.owner }}</p></div>
              </div>
            </article>
          </template>
        </div>
      </section>

      <section aria-labelledby="dos" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px">
        <div style="background: #CDE6A7; border-radius: 24px; padding: 26px">
          <h2 id="dos" style="margin: 0 0 12px; font-size: 21px; font-weight: 800">Do</h2>
          <ul style="margin: 0; padding-left: 20px; font-size: 16px; line-height: 1.6"><li>Ask about their programme and what’s getting in the way.</li><li>Mention two or three relevant Wates projects.</li><li>Agree a follow-up and log it the same day.</li></ul>
        </div>
        <div style="background: #F7C8B3; border-radius: 24px; padding: 26px">
          <h2 style="margin: 0 0 12px; font-size: 21px; font-weight: 800">Don’t</h2>
          <ul style="margin: 0; padding-left: 20px; font-size: 16px; line-height: 1.6"><li>Discuss live bids, pricing or other clients’ projects.</li><li>Share or forward this briefing.</li><li>Spend the event with other Wates colleagues.</li></ul>
        </div>
      </section>

      <section aria-labelledby="team">
        <h2 id="team" style="margin: 0 0 14px; font-size: 24px; font-weight: 800">Wates at this event</h2>
        <div style="display: flex; flex-wrap: wrap; gap: 10px; font-size: 15px; font-weight: 700">
          <span style="padding: 10px 16px; border-radius: 999px; background: #FFFFFF">Rico Cacciatore · Ambassador</span>
          <span style="padding: 10px 16px; border-radius: 999px; background: #FFFFFF">[Name] · Ambassador</span>
          <span style="padding: 10px 16px; border-radius: 999px; background: #FFFFFF">[Name] · Ambassador</span>
          <span style="padding: 10px 16px; border-radius: 999px; background: #FFFFFF">[Name] · Director, host</span>
        </div>
      </section>
    </div>

    <aside aria-labelledby="rsvp" style="flex: 1 1 340px; min-width: 0; background: #F6EFDD; border-radius: 28px; padding: 30px; display: flex; flex-direction: column; gap: 18px; border: 2px solid #C9A54C">
      <h2 id="rsvp" style="margin: 0; font-size: 22px; font-weight: 800">Your invitation</h2>
      <p style="margin: 0; font-size: 16px; line-height: 1.5">You’ve been invited as a Wates Ambassador. Please reply by Friday 20 November.</p>
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; font-size: 16px">
        <li style="display: flex; justify-content: space-between; gap: 12px"><span>Ambassador places</span><strong>4</strong></li>
        <li style="display: flex; justify-content: space-between; gap: 12px"><span>Client guests expected</span><strong>8</strong></li>
        <li style="display: flex; justify-content: space-between; gap: 12px"><span>Your targets</span><strong>3</strong></li>
      </ul>
      <template data-sc="if" value="{{ notAccepted }}">
        <div style="display: flex; flex-direction: column; gap: 12px">
          <button type="button" onClick="{{ accept }}" style="display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 26px; border-radius: 999px; border: 0; background: #2F2E3F; color: #FFFFFF; font-family: inherit; font-weight: 800; font-size: 16px; cursor: pointer; text-decoration: none; color: #E6CD86">Accept invitation</button>
          <button type="button" style="display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 22px; border-radius: 999px; border: 2px solid #2F2E3F; background: transparent; color: #2F2E3F; font-family: inherit; font-weight: 700; font-size: 15px; cursor: pointer; text-decoration: none">I can’t make it</button>
        </div>
      </template>
      <template data-sc="if" value="{{ accepted }}">
        <div role="status" style="background: #CDE6A7; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 8px">
          <p style="margin: 0; font-size: 18px; font-weight: 800">You’re going</p>
          <p style="margin: 0; font-size: 15px; line-height: 1.5">Your place is confirmed. Your line manager has been told, and the organiser will share any late changes to the guest list.</p>
          <button type="button" onClick="{{ undo }}" style="margin-top: 6px; display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 22px; border-radius: 999px; border: 2px solid #2F2E3F; background: transparent; color: #2F2E3F; font-family: inherit; font-weight: 700; font-size: 15px; cursor: pointer; text-decoration: none">Cancel</button>
        </div>
      </template>
      <div style="background: #FFFFFF; border-radius: 18px; padding: 16px; font-size: 14px; line-height: 1.55">
        <p style="margin: 0 0 6px; font-weight: 800">Confidential</p>
        <p style="margin: 0">Client information in this briefing is for ambassadors attending this event only. Please don’t share, copy or export it.</p>
      </div>
      <a href="Feedback.html" style="font-size: 15px; font-weight: 700">After the event: log who you met →</a>
    </aside>
  </main>
</div>
</template>
<script type="text/plain" id="logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { accepted: false };
  }
  renderVals() {
    var self = this;
    var a = this.state.accepted;
    return {
      accepted: a,
      notAccepted: !a,
      accept: function () { self.setState({ accepted: true }); },
      undo: function () { self.setState({ accepted: false }); },
      targets: [
        { initials: 'RL', name: '[Name]', role: 'Head of Development, Riverstone Living', priority: 'High priority', prioBg: '#F9E569', bar: '#F9E569', colour: '#F9E569', why: 'Leads their London pipeline and will shape the [2027 framework].', talk: 'Their build-to-rent schemes and how they like to engage contractors early.', owner: '[Name], Director' },
        { initials: 'RL', name: '[Name]', role: 'Development Manager, Riverstone Living', priority: 'High priority', prioBg: '#F9E569', bar: '#F9E569', colour: '#F9E569', why: 'Runs day-to-day delivery on their two largest schemes.', talk: 'Site logistics, sustainability targets and lessons from recent projects.', owner: '[Name], Operations Manager' },
        { initials: 'CM', name: '[Name]', role: 'Partner, Calder Moss (cost consultant to Riverstone)', priority: 'Medium priority', prioBg: '#C1D1FF', bar: '#C1D1FF', colour: '#C1D1FF', why: 'Advises Riverstone on procurement and contractor shortlists.', talk: 'Market conditions and early cost certainty, not live bids.', owner: '[Name], Commercial Director' }
      ]
    };
  }
}
</script>
